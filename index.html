    <div id="root" class="h-full w-full"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef, useCallback, useMemo } = React;

        // --- GEMINI API CONFIG ---
        const getEffectiveApiKey = () => localStorage.getItem('gemini_api_key') || '';

        // --- UTILS ---
        const pcmToWav = (pcmData, sampleRate = 24000) => {
            const buffer = new ArrayBuffer(44 + pcmData.byteLength);
            const view = new DataView(buffer);
            const writeString = (offset, string) => { for (let i = 0; i < string.length; i++) view.setUint8(offset + i, string.charCodeAt(i)); };
            writeString(0, 'RIFF'); view.setUint32(4, 36 + pcmData.byteLength, true); writeString(8, 'WAVE'); writeString(12, 'fmt ');
            view.setUint32(16, 16, true); view.setUint16(20, 1, true); view.setUint16(22, 1, true); view.setUint32(24, sampleRate, true);
            view.setUint32(28, sampleRate * 2, true); view.setUint16(32, 2, true); view.setUint16(34, 16, true); writeString(36, 'data');
            view.setUint32(40, pcmData.byteLength, true);
            const pcmView = new Uint8Array(pcmData);
            const wavView = new Uint8Array(buffer, 44);
            wavView.set(pcmView);
            return buffer;
        };

        const pcmToWavUrl = (pcmBytes) => {
            const wavBuffer = pcmToWav(pcmBytes.buffer);
            return URL.createObjectURL(new Blob([wavBuffer], { type: 'audio/wav' }));
        };

        const concatUint8Arrays = (arrays) => {
            let totalLength = 0;
            for (const arr of arrays) totalLength += arr.length;
            const result = new Uint8Array(totalLength);
            let offset = 0;
            for (const arr of arrays) {
                result.set(arr, offset);
                offset += arr.length;
            }
            return result;
        };

        const chunkText = (text, maxLength = 800) => {
            const chunks = [];
            let currentText = text;
            while (currentText.length > 0) {
                if (currentText.length <= maxLength) {
                    chunks.push(currentText);
                    break;
                }
                
                // Find a safe split point
                let splitIndex = -1;
                // Search backwards from maxLength for a sentence end
                for (let i = maxLength; i >= Math.floor(maxLength / 2); i--) {
                    const char = currentText[i];
                    if (char === '.' || char === '?' || char === '!') {
                        // Check if we are inside brackets by looking back
                        const partBefore = currentText.substring(0, i);
                        const lastOpen = partBefore.lastIndexOf('[');
                        const lastClose = partBefore.lastIndexOf(']');
                        if (lastOpen > lastClose) {
                            // We are inside a bracket, don't split here
                            continue;
                        }
                        splitIndex = i;
                        break;
                    }
                }
                
                // Fallback to space
                if (splitIndex === -1) {
                    for (let i = maxLength; i >= Math.floor(maxLength / 2); i--) {
                        const char = currentText[i];
                        if (char === ' ') {
                            const partBefore = currentText.substring(0, i);
                            const lastOpen = partBefore.lastIndexOf('[');
                            const lastClose = partBefore.lastIndexOf(']');
                            if (lastOpen > lastClose) {
                                continue;
                            }
                            splitIndex = i;
                            break;
                        }
                    }
                }
                
                if (splitIndex === -1) {
                    splitIndex = maxLength;
                }
                
                chunks.push(currentText.substring(0, splitIndex + 1).trim());
                currentText = currentText.substring(splitIndex + 1).trim();
            }
            return chunks;
        };

        const callGeminiTTS = async (text) => {
            const key = getEffectiveApiKey();
            if (!key) throw new Error("API Key missing");
            
            const models = ["gemini-2.5-flash-preview-tts", "gemini-2.5-pro-preview-tts", "gemini-3.1-flash-tts-preview"];
            let lastError = null;
            
            console.log(`[TTS] Initiating synthesis for text chunk (${text.length} chars): "${text.substring(0, 60)}..."`);
            const startTime = performance.now();
            
            for (const model of models) {
                try {
                    console.log(`[TTS] Trying model ${model}...`);
                    const modelStartTime = performance.now();
                    const url = `https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${key}`;
                    const payload = { 
                        contents: [{ parts: [{ text }] }], 
                        generationConfig: { 
                            responseModalities: ["AUDIO"], 
                            speechConfig: { 
                                voiceConfig: { 
                                    prebuiltVoiceConfig: { 
                                        voiceName: "Kore" 
                                    } 
                                } 
                            } 
                        } 
                    };
                    const response = await fetch(url, { 
                        method: "POST", 
                        headers: { "Content-Type": "application/json" }, 
                        body: JSON.stringify(payload) 
                    });
                    if (!response.ok) {
                        const err = await response.json();
                        throw new Error(err.error?.message || `TTS API Error for ${model}`);
                    }
                    const data = await response.json();
                    const base64Audio = data.candidates?.[0]?.content?.parts?.[0]?.inlineData?.data;
                    if (!base64Audio) throw new Error(`No audio returned from ${model}`);
                    
                    const binaryString = window.atob(base64Audio);
                    const len = binaryString.length;
                    const bytes = new Uint8Array(len);
                    for (let i = 0; i < len; i++) bytes[i] = binaryString.charCodeAt(i);
                    
                    const duration = ((performance.now() - modelStartTime) / 1000).toFixed(2);
                    console.log(`[TTS] Synthesis SUCCESS with model ${model} in ${duration}s. Returned PCM size: ${bytes.byteLength} bytes.`);
                    return bytes; // returns raw PCM bytes
                } catch (err) {
                    const duration = ((performance.now() - startTime) / 1000).toFixed(2);
                    console.warn(`[TTS] Synthesis failed for ${model} after ${duration}s. Error:`, err);
                    lastError = err;
                }
            }
            console.error(`[TTS] Synthesis FAILED for all models in ${((performance.now() - startTime) / 1000).toFixed(2)}s.`);
            throw lastError || new Error("TTS generation failed for all models");
        };

        const callGeminiSummary = async (text) => {
            const key = getEffectiveApiKey();
            if (!key) throw new Error("API Key missing");
            
            const models = ["gemini-3.5-flash", "gemini-3.1-flash-lite", "gemini-2.5-flash", "gemini-2.0-flash"];
            let lastError = null;
            
            console.log(`[Summary] Initiating chapter summary request (${text.length} chars)...`);
            const startTime = performance.now();
            
            for (const model of models) {
                try {
                    console.log(`[Summary] Trying model ${model}...`);
                    const modelStartTime = performance.now();
                    const url = `https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${key}`;
                    const payload = { contents: [{ parts: [{ text: "Summarize this chapter concisely:\n\n" + text.substring(0, 15000) }] }] };
                    
                    const response = await fetch(url, { 
                        method: "POST", 
                        headers: { "Content-Type": "application/json" }, 
                        body: JSON.stringify(payload) 
                    });
                    if (!response.ok) {
                        const err = await response.json();
                        throw new Error(err.error?.message || `Summary API Error for ${model}`);
                    }
                    const data = await response.json();
                    const result = data.candidates?.[0]?.content?.parts?.[0]?.text || "No summary generated.";
                    
                    const duration = ((performance.now() - modelStartTime) / 1000).toFixed(2);
                    console.log(`[Summary] Summary SUCCESS with model ${model} in ${duration}s.`);
                    return result;
                } catch (err) {
                    const duration = ((performance.now() - startTime) / 1000).toFixed(2);
                    console.warn(`[Summary] Summary failed for ${model} after ${duration}s. Error:`, err);
                    lastError = err;
                }
            }
            console.error(`[Summary] Summary FAILED for all models in ${((performance.now() - startTime) / 1000).toFixed(2)}s.`);
            throw lastError || new Error("Summary generation failed for all models");
        };

        const callGeminiFormatText = async (text, narratorPrompt = "") => {
            const key = getEffectiveApiKey();
            if (!key) throw new Error("API Key missing");
            
            const models = ["gemini-3.5-flash", "gemini-3.1-flash-lite", "gemini-2.5-flash", "gemini-2.0-flash"];
            let lastError = null;
            
            const systemPrompt = `You are an expert audiobook director and script editor. 
Your task is to format the following text excerpt from a book chapter to be read by the Google Gemini Native Audio Generation Text-to-Speech (TTS) model.
You must analyze the mood, tone, genre, and characters of the text, and output a fully directed prompt in the exact format shown below.
${narratorPrompt ? `\nCRITICAL NARRATOR REQUIREMENT: The user has specified this custom narrator instruction that you MUST strictly adhere to and implement in the AUDIO PROFILE and DIRECTOR'S NOTES: "${narratorPrompt}"\n` : ''}

Follow these strict rules:
1. Define a compelling, appropriate voice persona in the AUDIO PROFILE.
2. Set the physical and emotional vibe in THE SCENE.
3. In DIRECTOR'S NOTES, define the Style (e.g. dramatic, suspenseful, warm), Pacing (e.g. slow, moderate, varying), and Accent. Keep these concise and aligned with the characters and narrator.
4. Under TRANSCRIPT, rewrite the text to include the EXACT SAME WORDS as the original, but annotated with inline audio tags in square brackets to steer the model's delivery.
5. Use tags like [whispers], [sighs], [gasp], [excited], [serious], [trembling], [crying], [short pause], [very slow], [very fast], [sarcastically], [amazed], [giggles], [laughs], [tired] to bring the narrative to life. Put them at appropriate places (e.g. before dialogue, at sentence transitions).
6. Do not omit any words from the original text under the TRANSCRIPT section.

Your output MUST use the following markdown template exactly:

# AUDIO PROFILE: [Choose a Name]
## "[Vibe description]"

## THE SCENE: [Scene description]
[Detail scene environment]

### DIRECTOR'S NOTES
Style: [Style guidance]
Pacing: [Pacing guidance]
Accent: [Accent guidance]

### SAMPLE CONTEXT
[Narrative context]

#### TRANSCRIPT
[Your annotated transcript goes here]`;

            console.log(`[Format Text] Initiating formatting request for text segment (${text.length} chars)...`);
            const startTime = performance.now();
            
            for (const model of models) {
                try {
                    console.log(`[Format Text] Trying model ${model}...`);
                    const modelStartTime = performance.now();
                    const url = `https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${key}`;
                    const payload = {
                        contents: [
                            { parts: [{ text: `${systemPrompt}\n\nHere is the text excerpt to format:\n\n${text}` }] }
                        ]
                    };
                    
                    const response = await fetch(url, { 
                        method: "POST", 
                        headers: { "Content-Type": "application/json" }, 
                        body: JSON.stringify(payload) 
                    });
                    if (!response.ok) {
                        const err = await response.json();
                        throw new Error(err.error?.message || `Formatting API Error for ${model}`);
                    }
                    const data = await response.json();
                    const result = data.candidates?.[0]?.content?.parts?.[0]?.text || "";
                    
                    const duration = ((performance.now() - modelStartTime) / 1000).toFixed(2);
                    console.log(`[Format Text] Formatting SUCCESS with model ${model} in ${duration}s.`);
                    return result;
                } catch (err) {
                    const duration = ((performance.now() - startTime) / 1000).toFixed(2);
                    console.warn(`[Format Text] Formatting failed for ${model} after ${duration}s. Error:`, err);
                    lastError = err;
                }
            }
            console.error(`[Format Text] Formatting FAILED for all models in ${((performance.now() - startTime) / 1000).toFixed(2)}s.`);
            throw lastError || new Error("Text formatting failed for all models");
        };

        class TTSQueuePlayer {
            constructor(chunks, header, onChunkStart, onChunkEnd, onError, onFinished, unlockedAudioElement) {
                console.log(`[TTS Queue] Initializing player with ${chunks.length} chunks.`);
                chunks.forEach((c, idx) => console.log(`  Chunk ${idx}: "${c.substring(0, 60)}..." (${c.length} chars)`));
                this.chunks = chunks;
                this.header = header;
                this.onChunkStart = onChunkStart;
                this.onChunkEnd = onChunkEnd;
                this.onError = onError;
                this.onFinished = onFinished;
                
                this.currentIndex = 0;
                this.isPlaying = false;
                this.audioElement = unlockedAudioElement || new Audio();
                this.cache = {}; // index -> Promise of Uint8Array (PCM)
                
                this.audioElement.onended = () => {
                    console.log(`[TTS Queue] Chunk ${this.currentIndex} audio ended.`);
                    if (this.onChunkEnd) this.onChunkEnd(this.currentIndex);
                    this.currentIndex++;
                    this.playNext();
                };
            }
            
            prefetch(index) {
                if (index >= this.chunks.length) {
                    console.log(`[TTS Queue] Prefetch: index ${index} out of bounds.`);
                    return;
                }
                if (this.cache[index]) {
                    console.log(`[TTS Queue] Prefetch: index ${index} already cached/fetching.`);
                    return;
                }
                
                console.log(`[TTS Queue] Prefetching chunk ${index}...`);
                const chunkText = this.chunks[index];
                const ttsPrompt = this.header ? `${this.header}\n\n#### TRANSCRIPT\n${chunkText}` : chunkText;
                
                this.cache[index] = (async () => {
                    const startPrefetchTime = performance.now();
                    try {
                        const pcmBytes = await callGeminiTTS(ttsPrompt);
                        console.log(`[TTS Queue] Prefetch chunk ${index} complete in ${((performance.now() - startPrefetchTime) / 1000).toFixed(2)}s.`);
                        return pcmBytes;
                    } catch (err) {
                        console.error(`[TTS Queue] Prefetch chunk ${index} failed:`, err);
                        delete this.cache[index]; // Clear to allow retry
                        throw err;
                    }
                })();
            }
            
            async play() {
                console.log("[TTS Queue] Queue play() called.");
                if (this.isPlaying) return;
                this.isPlaying = true;
                this.playNext();
            }
            
            pause() {
                console.log("[TTS Queue] Queue pause() called.");
                this.isPlaying = false;
                this.audioElement.pause();
            }
            
            destroy() {
                console.log("[TTS Queue] Queue destroy() called.");
                this.pause();
                this.audioElement.src = "";
                this.audioElement.onended = null;
                this.cache = {};
            }
            
            async playNext() {
                if (!this.isPlaying) {
                    console.log("[TTS Queue] playNext: isPlaying is false, aborting.");
                    return;
                }
                
                if (this.currentIndex >= this.chunks.length) {
                    console.log("[TTS Queue] Completed all chunks in queue.");
                    this.isPlaying = false;
                    if (this.onFinished) this.onFinished();
                    return;
                }
                
                const idx = this.currentIndex;
                console.log(`[TTS Queue] Processing playNext for chunk index ${idx} of ${this.chunks.length}.`);
                if (this.onChunkStart) this.onChunkStart(idx);
                
                try {
                    // Pre-fetch the next chunk
                    this.prefetch(idx + 1);
                    
                    // If current chunk isn't cached/prefetched, fetch it now
                    if (!this.cache[idx]) {
                        console.log(`[TTS Queue] Current chunk ${idx} not in cache. Fetching immediately...`);
                        this.prefetch(idx);
                    }
                    
                    const fetchStartTime = performance.now();
                    const pcmBytes = await this.cache[idx];
                    console.log(`[TTS Queue] Got PCM bytes for chunk ${idx} in ${((performance.now() - fetchStartTime) / 1000).toFixed(2)}s. Converting to WAV...`);
                    const audioUrl = pcmToWavUrl(pcmBytes);
                    
                    console.log(`[TTS Queue] Loading audio source URL for chunk ${idx}...`);
                    this.audioElement.src = audioUrl;
                    console.log(`[TTS Queue] Playing audio for chunk ${idx}...`);
                    await this.audioElement.play();
                    console.log(`[TTS Queue] Audio play() promise resolved for chunk ${idx}.`);
                } catch (err) {
                    console.error(`[TTS Queue] Playback error in QueuePlayer for chunk ${idx}:`, err);
                    this.isPlaying = false;
                    if (this.onError) this.onError(err);
                }
            }
        }

        // --- DB LAYER ---
        const DB_NAME = 'AudiobookManagerDB';
        const DB_VERSION = 2; 
        const openDB = () => new Promise((resolve, reject) => {
            const req = indexedDB.open(DB_NAME, DB_VERSION);
            req.onerror = () => reject('DB Error');
            req.onupgradeneeded = (e) => {
                const db = e.target.result;
                if (!db.objectStoreNames.contains('books')) db.createObjectStore('books', { keyPath: 'id' });
                if (!db.objectStoreNames.contains('files')) db.createObjectStore('files', { keyPath: 'id' });
            };
            req.onsuccess = (e) => resolve(e.target.result);
        });
        const dbOp = async (mode, store, cb) => {
            const db = await openDB();
            return new Promise((resolve, reject) => {
                const tx = db.transaction(store, mode);
                const req = cb(tx.objectStore(store));
                req.onsuccess = () => resolve(req.result);
                req.onerror = () => reject(req.error);
            });
        };
        const patchBook = async (bookId, updates) => {
            const db = await openDB();
            const tx = db.transaction('books', 'readwrite');
            const store = tx.objectStore('books');
            const book = await new Promise((resolve, reject) => { const req = store.get(bookId); req.onsuccess = () => resolve(req.result); req.onerror = () => reject(req.error); });
            if (!book) return;
            store.put({ ...book, ...updates });
            return new Promise(resolve => tx.oncomplete = resolve);
        };
        const saveFiles = async (files) => {
            const db = await openDB();
            const tx = db.transaction('files', 'readwrite');
            const store = tx.objectStore('files');
            files.forEach(f => store.put(f));
            return new Promise(resolve => tx.oncomplete = resolve);
        };
        
        // Deep delete helper
        const deleteBookDeep = async (bookId) => {
            const db = await openDB();
            return new Promise((resolve, reject) => {
                const tx = db.transaction(['books', 'files'], 'readwrite');
                const booksStore = tx.objectStore('books');
                const filesStore = tx.objectStore('files');

                // 1. Get the book first
                const req = booksStore.get(bookId);
                
                req.onsuccess = () => {
                    const book = req.result;
                    if (!book) {
                        resolve();
                        return;
                    }

                    // 2. Delete Cover
                    if (book.coverId) filesStore.delete(book.coverId);

                    // 3. Delete EPUB
                    if (book.epubId) filesStore.delete(book.epubId);

                    // 4. Delete Audio Files
                    if (book.tracks && Array.isArray(book.tracks)) {
                        book.tracks.forEach(track => {
                            if (track.fileId) filesStore.delete(track.fileId);
                        });
                    }

                    // 5. Delete Book Record
                    booksStore.delete(bookId);
                };

                req.onerror = () => reject(req.error);
                tx.oncomplete = () => resolve();
                tx.onerror = () => reject(tx.error);
            });
        };

        const Icon = ({ name, size = 24, className = "" }) => {
            useEffect(() => lucide.createIcons(), [name]);
            return <i data-lucide={name} width={size} height={size} className={className}></i>;
        };

        const formatTime = (s) => {
            if (!s || isNaN(s)) return "0:00";
            const m = Math.floor(s / 60);
            const sec = Math.floor(s % 60);

            ];

            const [settings, setSettings] = useState(() => {
                const saved = localStorage.getItem('reader_settings');
                return saved ? JSON.parse(saved) : {
                    theme: 'light',
                    fontSize: 100,
                    fontFamily: '"Cormorant Garamond", Georgia, serif',

                    dialogueEnhance: false,
                    textColor: '#1c1917'
                };
            });

            useEffect(() => { localStorage.setItem('reader_settings', JSON.stringify(settings)); }, [settings]);
            
            const updateSetting = (key, value) => {
                if (key === 'theme') {
                    const textColors = {
                        light: '#1C1917',

                        dark: '#E2E2E6'
                    };

            }, []);

            // Dynamic spread handler for wide screens (2-column desktop view)
            useEffect(() => {
                if (!rendition) return;

                    const isDesktop = window.innerWidth >= 1024;
                    rendition.spread(isDesktop ? "always" : "none");
                    rendition.resize();
                };
                window.addEventListener('resize', handleResize);
                return () => window.removeEventListener('resize', handleResize);

            useEffect(() => {
                const init = async () => {
                    if (!bookId) return;

                    setRendition(rend);

                    rend.hooks.content.register((contents) => {
                        const doc = contents.document;
                        
                        // Load Cormorant Google Fonts in the EPUB iframe
                        const link = doc.createElement('link');
                        link.rel = 'stylesheet';
                        link.href = 'https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;0,700;1,400&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap';
                        doc.head.appendChild(link);

                        style.textContent = `
                            .dialogue-text { display: inline; color: inherit; }
                            body { font-family: 'Cormorant Garamond', Georgia, serif; line-height: 1.6; }
                            p { line-height: 1.7 !important; margin-bottom: 1.25em !important; text-align: justify; }

                        doc.head.appendChild(style);

                        // Attach toggle click listener inside the EPUB iframe
                        doc.addEventListener('click', () => {
                            window.dispatchEvent(new CustomEvent('epub-click'));
                        });

                        const walker = doc.createTreeWalker(doc.body, NodeFilter.SHOW_TEXT, null, false);
                        const nodes = [];
                        while(walker.nextNode()) nodes.push(walker.currentNode);

                        const regex = /([“"”][^"”]*[”"“])|("[^"]*")/g; 

                        nodes.forEach(node => {
                            if (!node.nodeValue || node.parentElement.tagName === 'SCRIPT' || node.parentElement.tagName === 'STYLE') return;
                            const text = node.nodeValue;
                            if (!regex.test(text)) return;
                            
                            regex.lastIndex = 0;
                            const fragment = doc.createDocumentFragment();
                            let lastIndex = 0;
                            let match;

                            while ((match = regex.exec(text)) !== null) {
                                if (match.index > lastIndex) fragment.appendChild(document.createTextNode(text.substring(lastIndex, match.index)));
                                const span = doc.createElement('span');
                                span.className = 'dialogue-text';
                                span.textContent = match[0];
                                span.style.textShadow = 'var(--dialogue-shadow, none)';
                                fragment.appendChild(span);
                                  lastIndex = regex.lastIndex;
                            }
                            if (lastIndex < text.length) fragment.appendChild(document.createTextNode(text.substring(lastIndex)));
                            node.parentNode.replaceChild(fragment, node);
                        });
                    });

                            label = titleEl.innerText.trim();

                            const pTags = doc.querySelectorAll('p');
                            for (let p of pTags) {
                                const text = p.innerText.trim();
                                if (/^(Chapter|Part|Prologue|Epilogue)\s+\d+/i.test(text) || /^\d+$/.test(text)) {
                                    if (text.length < 50) { label = text; break; }
                                }
                            }
                        }
                        if (label) newToc.push({ label: label, href: item.href });

            };

                if (!rendition) return null;
                const visible = rendition.currentLocation();

                try {
                    const startRange = rendition.getRange(visible.start.cfi);
                    const endRange = rendition.getRange(visible.end.cfi);
                    if (!startRange || !endRange) return null;
                    const range = startRange.startContainer.ownerDocument.createRange();

                                    generationConfig: {
                                        responseModalities: ["IMAGE"],
                                        imageConfig: {
                                            aspectRatio: "3:4"
                                        }
                                    }
                                })
                            });
                            
                            if (!res.ok) {
                                const err = await res.json();
                                throw new Error(err.error?.message || `Failed to generate image with ${model}`);
                            }
                            response = res;
                            break;
                        } catch (err) {
                            console.warn(`Cover generation with ${model} failed, trying next... Error:`, err);
                            lastError = err;
                        }
                    }
                    
                    if (!response) {
                        throw lastError || new Error("Image generation failed for all models");
                    }
                    
                    const data = await response.json();
                    const parts = data.candidates?.[0]?.content?.parts || [];
                    let base64 = null;
                    let mimeType = 'image/jpeg';
                    for (const part of parts) {
                        if (part.inlineData && part.inlineData.data) {
                            base64 = part.inlineData.data;
                            mimeType = part.inlineData.mimeType || 'image/jpeg';
                            break;
                        }
                    }
                    
                    if (!base64) {
                        throw new Error("No image data returned from generator.");
                    }
                    
                    const binaryString = window.atob(base64);
                    const len = binaryString.length;
                    const bytes = new Uint8Array(len);
                    for (let i = 0; i < len; i++) bytes[i] = binaryString.charCodeAt(i);
                    const blob = new Blob([bytes], { type: mimeType });
                    
                    const id = crypto.randomUUID();
                    const fileObj = new File([blob], "ai-cover.jpg", { type: mimeType });
                    await saveFiles([{ id, data: fileObj, type: 'image' }]);
                    
                    setCoverId(id);
                    setCoverPreview(URL.createObjectURL(blob));
                    setShowGenerator(false);
                    setGenPrompt("");
                } catch (e) {
                    console.error(e);
                    alert("Error generating cover: " + e.message);
                } finally {
                    setGenerating(false);
                }
            };

            useEffect(() => {
                if (!bookId) return;
                const load = async () => {
                    const book = await dbOp('readonly', 'books', s => s.get(bookId));
                    if (book) {
                        setTitle(book.title);
                        setAuthor(book.author);
                        setCoverId(book.coverId);
                        setEpubId(book.epubId);
                        setNarratorPrompt(book.narratorPrompt || "");
                        const normalizedTracks = (book.tracks || []).map(t => ({
                            ...t,
                            fileId: t.fileId || t.id,
                            start: t.start || 0,
                            duration: t.duration || null 
                        }));
                        setTracks(normalizedTracks);
                        if (book.coverId) {
                            const f = await dbOp('readonly', 'files', s => s.get(book.coverId));
                            if (f) setCoverPreview(URL.createObjectURL(f.data));
                        }
                    }
                };
                load();
            }, [bookId]);

            const handleCoverUpload = async (e) => {
                const file = e.target.files[0];
                if (!file) return;
                setCoverPreview(URL.createObjectURL(file));
                const id = crypto.randomUUID();
                setCoverId(id);
                await saveFiles([{ id, data: file, type: 'image' }]);
            };

            const handleExportCover = async () => {
                if (!coverPreview) return;
                try {
                    const response = await fetch(coverPreview);
                    const blob = await response.blob();
                    const url = window.URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = `${title.toLowerCase().replace(/[^a-z0-9]+/g, '_')}_cover.jpg`;
                    document.body.appendChild(a);
                    a.click();
                    document.body.removeChild(a);
                    window.URL.revokeObjectURL(url);
                } catch (e) {
                    console.error(e);
                    alert("Failed to export cover image: " + e.message);
                }
            };

            const handleEpubUpload = async (e) => {
                const file = e.target.files[0];
                if (!file) return;
                const id = crypto.randomUUID();
                setEpubId(id);
                await saveFiles([{ id, data: file, type: 'epub' }]);
            };

            const handleAddTracks = async (e) => {
                setProcessing(true);
                setStatus("Importing tracks...");
                const files = Array.from(e.target.files);
                const newFiles = [];
                const newTracks = [];
                for (let f of files) {
                    if (f.name.endsWith('.mp3') || f.name.endsWith('.wav') || f.name.endsWith('.m4a') || f.type.startsWith('audio/')) {
                        const id = crypto.randomUUID();
                        newFiles.push({ id, data: f, type: 'audio' });
                        newTracks.push({ id, fileId: id, name: f.name, start: 0, duration: null });
                    }
                }
                await saveFiles(newFiles);
                setTracks(prev => [...prev, ...newTracks]);
                setProcessing(false);
            };

            const openSplitMenu = async (idx) => {
                const track = tracks[idx];
                const fileRec = await dbOp('readonly', 'files', s => s.get(track.fileId));
                if (!fileRec) return;
                setSplitTarget({ idx, track, file: fileRec.data });
            };

            const executeSplitByTime = async (minutes) => {
                const { idx, track, file } = splitTarget;
                setSplitTarget(null);
                setProcessing(true);
                setStatus("Calculating Duration...");
                try {
                    const audio = document.createElement('audio');
                    audio.muted = true;
                    const url = URL.createObjectURL(file);
                    audio.src = url;
                    await new Promise(r => audio.onloadedmetadata = r);
                    const duration = audio.duration;
                    URL.revokeObjectURL(url);

                    const chunkSeconds = minutes * 60;
                    const parts = Math.ceil(duration / chunkSeconds);
                    const newTracks = [];
                    for (let i = 0; i < parts; i++) {
                        const start = i * chunkSeconds;
                        const end = Math.min((i + 1) * chunkSeconds, duration);
                        newTracks.push({
                            id: crypto.randomUUID(),
                            fileId: track.fileId,
                            name: `${track.name} - Part ${i + 1}`,
                            start: start,
                            duration: end - start
                        });
                    }
                    const updated = [...tracks];
                    updated.splice(idx, 1, ...newTracks);
                    setTracks(updated);
                    setStatus(`Split into ${parts} parts!`);
                } catch(e) { alert("Error splitting file."); } finally { setProcessing(false); setTimeout(() => setStatus(""), 2000); }
            };

            const executeSplitSilence = async () => {
                alert("Please use Time Split for large files.");
                setSplitTarget(null);
            };

            const sortTracks = () => {
                const sorted = [...tracks].sort((a, b) => a.name.localeCompare(b.name, undefined, { numeric: true, sensitivity: 'base' }));
                setTracks(sorted);
            };

            const shuffleTracks = () => {
                setTracks(prev => {
                    const shuffled = [...prev];
                    for (let i = shuffled.length - 1; i > 0; i--) {
                        const j = Math.floor(Math.random() * (i + 1));
                        [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];

            };

            const removeTrack = (idx) => { setTracks(prev => prev.filter((_, i) => i !== idx)); };

            const handleSave = async () => {

                let currentTime = 0;
                if (bookId) {

                const book = { id, title, author, coverId, epubId, tracks, narratorPrompt, updatedAt: Date.now(), currentTrackIndex, currentTime };
                await dbOp('readwrite', 'books', s => s.put(book));
                onSave();
            };
            
            const handleDeleteBook = async () => {
                if (!bookId) return;
                setProcessing(true);
                setStatus("Deleting...");
                try {
                    await deleteBookDeep(bookId);

            return (
                <>
                    <div

                    <div className="fixed inset-x-0 bottom-0 top-[8%] md:top-[10%] md:bottom-[8%] max-w-lg md:mx-auto z-50 bg-[#121115]/95 border border-white/10 flex flex-col rounded-t-3xl md:rounded-3xl shadow-2xl animate-in slide-in-from-bottom duration-300 overflow-hidden text-gray-100">
                        <div className="bg-white/5 backdrop-blur border-b border-white/10 px-6 py-4 flex justify-between items-center">

                        </div>

                    <div className="flex-1 overflow-y-auto p-6 pb-20 safe-bottom no-scrollbar">
                        <div className="flex gap-4 mb-6">
                            <div className="flex flex-col items-center">
                                <div className="w-28 h-28 bg-[#18171c] rounded-lg flex-shrink-0 relative overflow-hidden group shadow-md border border-white/5">
                                    {coverPreview ? <img src={coverPreview} className="w-full h-full object-cover" /> : <div className="w-full h-full flex items-center justify-center text-gray-500"><Icon name="image" size={28} /></div>}
                                    <label className="absolute inset-0 bg-black/60 flex items-center justify-center opacity-0 group-hover:opacity-100 transition cursor-pointer">
                                        <span className="text-white text-[10px] font-bold uppercase tracking-widest bg-brand-red px-2.5 py-1.5 rounded-full">Upload</span>
                                        <input type="file" accept="image/*" className="hidden" onChange={handleCoverUpload} />
                                    </label>
                                </div>
                                <div className="flex gap-1.5 mt-2">
                                    <button 
                                        type="button" 
                                        onClick={() => setShowGenerator(true)} 
                                        className="text-[9px] font-bold uppercase tracking-widest text-brand-red border border-brand-red/20 px-2.5 py-1 rounded-full hover:bg-brand-red/10 transition"
                                    >
                                        AI Cover
                                    </button>
                                    {coverPreview && (
                                        <button 
                                            type="button" 
                                            onClick={handleExportCover} 
                                            className="text-[9px] font-bold uppercase tracking-widest text-gray-300 border border-white/10 px-2.5 py-1 rounded-full hover:bg-white/5 transition flex items-center gap-1"
                                            title="Export Cover Image"
                                        >
                                            <Icon name="download" size={10} /> Export
                                        </button>
                                    )}
                                </div>
                            </div>
                            <div className="flex-1 flex flex-col justify-between py-1">
                                <input 
                                    type="text" 
                                    placeholder="Book Title" 
                                    value={title} 
                                    onChange={e => setTitle(e.target.value)} 
                                    className="w-full bg-white/5 p-2.5 rounded-xl border border-white/10 focus:border-brand-red focus:ring-1 focus:ring-brand-red text-white text-lg font-serif font-semibold outline-none transition" 
                                />
                                <input 
                                    type="text" 
                                    placeholder="Author" 
                                    value={author} 
                                    onChange={e => setAuthor(e.target.value)}

                            </div>

                        <div className="bg-white/5 border border-white/10 rounded-2xl p-4 mb-6">

                            </div>
                            <textarea

                                placeholder="Describe the voice, tone, style, and accent (e.g., 'A warm, deep male baritone with a mild British accent reading in a suspenseful, intimate tone...')" 
                                rows="3"
                                className="w-full bg-white/5 p-3 rounded-xl border border-white/10 focus:border-brand-red focus:ring-1 focus:ring-brand-red text-white text-xs outline-none transition resize-none leading-relaxed"
                            />
                            <p className="text-[10px] text-gray-400 mt-2 leading-normal font-serif italic">This description guides the AI director when it formats the text for narration.</p>

                            <label className="text-[10px] font-bold uppercase tracking-wider text-white bg-white/10 hover:bg-white/15 border border-white/10 hover:border-white/20 cursor-pointer px-4 py-2.5 rounded-full transition">
                                {epubId ? "Change" : "Upload"}
                                <input type="file" accept=".epub,application/epub+zip" className="hidden" onChange={handleEpubUpload} />

                        <div className="bg-white/5 border border-white/10 rounded-2xl overflow-hidden mb-6">
                            {tracks.length === 0 ? (
                                <div className="p-8 text-center text-gray-500 text-sm font-serif italic">No audio narratives loaded.</div>
                            ) : (
                                <div className="divide-y divide-white/5 max-h-[300px] overflow-y-auto no-scrollbar">
                                    {tracks.map((t, idx) => (
                                        <div key={idx} className="p-3.5 flex items-center gap-3 hover:bg-white/5 transition">
                                            <span className="text-gray-500 text-xs font-mono w-5">{idx + 1}</span>
                                            <div className="flex-1 min-w-0">
                                                <div className="truncate text-sm font-sans font-semibold text-gray-200">{t.name}</div>
                                                <div className="text-[10px] text-gray-400 uppercase tracking-wider font-bold mt-0.5">{t.start > 0 ? `Start: ${formatTime(t.start)}` : 'Full File'}{t.duration && ` • ${formatTime(t.duration)}`}</div>
                                            </div>
                                            {(!t.duration || t.duration > 120) && (
                                                <button 
                                                    onClick={() => openSplitMenu(idx)} 
                                                    className="text-gray-400 hover:text-brand-red hover:bg-white/10 p-2 rounded-full transition"
                                                    title="Split Track"
                                                >
                                                    <Icon name="scissors" size={14} />

                                            <button

                            <div className="p-3 bg-white/5 border-t border-white/10">
                                {processing ? (

                                        <Icon name="plus-circle" size={16} /> Add Audio Files
                                        <input type="file" multiple accept=".mp3,.wav,.m4a,audio/*" className="hidden" onChange={handleAddTracks} />
                                    </label>
                                )}
                            </div>
                        </div>

                        {bookId && (
                            <div className="mt-8 mb-4">
                                {!showDeleteConfirm ? (
                                    <button 
                                        onClick={() => setShowDeleteConfirm(true)} 
                                        className="w-full py-3.5 rounded-xl bg-brand-red/10 border border-brand-red/20 text-brand-red hover:bg-brand-red/20 hover:border-brand-red/30 font-sans text-xs font-bold uppercase tracking-widest transition-colors duration-200"
                                    >
                                        Delete Book Portfolio
                                    </button>
                                ) : (
                                    <div className="bg-brand-red/10 border border-brand-red/20 rounded-2xl p-4 animate-in fade-in slide-in-from-bottom-2">
                                        <p className="text-center text-brand-red font-serif italic mb-3 text-sm">Are you sure? This action cannot be undone.</p>
                                        <div className="flex gap-3">
                                            <button 
                                                onClick={() => setShowDeleteConfirm(false)} 
                                                className="flex-1 py-2.5 rounded-xl bg-white/5 border border-white/10 text-gray-300 font-sans text-xs font-bold uppercase tracking-widest hover:bg-white/10 transition"
                                            >
                                                Cancel
                                            </button>
                                            <button 
                                                onClick={handleDeleteBook} 
                                                className="flex-1 py-2.5 rounded-xl bg-brand-red hover:bg-[#be2f31] text-white font-sans text-xs font-bold uppercase tracking-widest shadow-lg transition"
                                            >
                                                Confirm Delete
                                            </button>
                                        </div>
                                    </div>
                                )}
                            </div>
                        )}
                    </div>
                    {splitTarget && <SplitOptions file={splitTarget.file} onSplitByTime={executeSplitByTime} onSplitSilence={executeSplitSilence} onCancel={() => setSplitTarget(null)} />}
                    
                    {/* Cover Generator Modal */}
                    {showGenerator && (
                        <div className="fixed inset-0 z-[70] flex items-center justify-center bg-black/75 backdrop-blur-sm p-4 animate-in fade-in">
                            <div className="bg-[#121115]/95 border border-white/10 text-gray-100 rounded-3xl w-full max-w-sm p-6 shadow-2xl" onClick={e => e.stopPropagation()}>
                                <h3 className="font-serif text-xl font-bold mb-4 text-center">AI Cover Generator</h3>
                                
                                <div className="mb-4">
                                    <label className="block text-[10px] font-bold uppercase tracking-widest text-gray-400 mb-2">Artistic Style</label>
                                    <select 
                                        value={genStyle} 
                                        onChange={e => setGenStyle(e.target.value)}
                                        className="w-full p-2.5 rounded-xl bg-white/5 border border-white/10 focus:border-brand-red focus:ring-1 focus:ring-brand-red text-xs text-white outline-none"
                                    >
                                        {coverStyles.map(s => <option key={s.name} value={s.prompt} className="bg-[#121115] text-white">{s.name}</option>)}
                                    </select>
                                </div>
                                
                                <div className="mb-6">
                                    <label className="block text-[10px] font-bold uppercase tracking-widest text-gray-400 mb-2">Subject / Concept</label>
                                    <textarea 
                                        rows="3"
                                        value={genPrompt} 
                                        onChange={e => setGenPrompt(e.target.value)} 
                                        placeholder="e.g. A lone wanderer standing on the edge of a cosmic cliff overlooking a glowing violet galaxy..." 
                                        className="w-full p-3 bg-white/5 border border-white/10 focus:border-brand-red focus:ring-1 focus:ring-brand-red rounded-xl outline-none text-xs text-white resize-none" 
                                    />
                                </div>
                                
                                <div className="flex gap-3">
                                    <button 
                                        type="button"
                                        onClick={() => setShowGenerator(false)} 
                                        className="flex-1 py-2.5 text-gray-400 hover:text-white font-sans text-[10px] font-bold uppercase tracking-widest border border-white/10 rounded-xl hover:bg-white/5 transition"
                                        disabled={generating}
                                    >
                                        Cancel
                                    </button>
                                    <button 
                                        type="button"
                                        onClick={generateCover} 
                                        className="flex-1 py-2.5 bg-brand-red hover:bg-[#be2f31] text-white font-sans text-[10px] font-bold uppercase tracking-widest rounded-xl shadow-lg transition flex items-center justify-center gap-1.5"
                                        disabled={generating || !genPrompt.trim()}
                                    >
                                        {generating ? (
                                            <>
                                                <div className="animate-spin rounded-full h-3 w-3 border-2 border-white/30 border-t-white"></div>
                                                Creating...
                                            </>
                                        ) : "Generate"}
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
                </>
            );
        };

        const Player = ({ bookId, onBack }) => {
            const audioRef = useRef(null);
            const [book, setBook] = useState(null);
            const [cover, setCover] = useState(null);
            const [playing, setPlaying] = useState(false);
            const [time, setTime] = useState(0);
            const [dur, setDur] = useState(0); 
            const [showList, setShowList] = useState(false);
            const [showReader, setShowReader] = useState(false);
            const activeFileId = useRef(null);

            useEffect(() => {
                const load = async () => {
                    const b = await dbOp('readonly', 'books', s => s.get(bookId));
                    setBook(b);
                    if (b.coverId) {
                        const f = await dbOp('readonly', 'files', s => s.get(b.coverId));
                        if(f) setCover(URL.createObjectURL(f.data));
                    }
                    if (b.tracks.length > 0) await loadTrack(b, b.currentTrackIndex || 0, false);
                };
                load();
            }, [bookId]);

            const loadTrack = async (b, index, autoPlay) => {
                const track = b.tracks[index];
                if (!track) return;
                const fileId = track.fileId || track.id;
                const startTime = track.start || 0;
                
                if (activeFileId.current !== fileId) {
                    const f = await dbOp('readonly', 'files', s => s.get(fileId));
                    if (f) {
                        const url = URL.createObjectURL(f.data);
                        audioRef.current.src = url;
                        activeFileId.current = fileId;
                        audioRef.current.currentTime = (index === b.currentTrackIndex) ? (b.currentTime || startTime) : startTime;
                    }
                } else {
                    const buffer = 1; 
                    if (audioRef.current.currentTime < startTime - buffer || audioRef.current.currentTime > (track.start + (track.duration||99999))) {
                        audioRef.current.currentTime = startTime;
                    }
                }
                if (autoPlay) { try { await audioRef.current.play(); setPlaying(true); } catch(e){} }
            };

            const updateBookProgress = (t) => {
                if (!bookId) return;
                patchBook(bookId, { currentTime: t });
            };

            const changeTrack = async (idx) => {
                const b = { ...book, currentTrackIndex: idx };
                const t = b.tracks[idx];
                b.currentTime = t.start || 0; 
                setBook(b);
                await loadTrack(b, idx, true);
                patchBook(bookId, { currentTrackIndex: idx, currentTime: b.currentTime });
            };

            const handleTimeUpdate = () => {
                const ct = audioRef.current.currentTime;
                setTime(ct);
                setDur(audioRef.current.duration);
                updateBookProgress(ct);

                if (book && book.tracks[book.currentTrackIndex]) {
                    const current = book.tracks[book.currentTrackIndex];
                    const endTime = (current.start || 0) + (current.duration || 999999);
                    
                    if (current.duration && ct >= endTime - 0.2) {
                        if (book.currentTrackIndex < book.tracks.length - 1) {
                            const nextIndex = book.currentTrackIndex + 1;
                            const nextTrack = book.tracks[nextIndex];
                            setBook(prev => ({ ...prev, currentTrackIndex: nextIndex }));
                            
                            if ((nextTrack.fileId || nextTrack.id) === (current.fileId || current.id)) {
                                patchBook(bookId, { currentTrackIndex: nextIndex });
                            } else {
                                changeTrack(nextIndex);
                            }
                        } else {
                            setPlaying(false);
                        }
                    }
                }
            };

            if (!book) return null;

            const currentTrack = book.tracks[book.currentTrackIndex];
            const trackStart = currentTrack?.start || 0;
            const trackDur = currentTrack?.duration || dur;
            const sliderVal = time - trackStart;
            
            return (
                <div className="relative h-full flex flex-col bg-[#09080a] overflow-hidden text-gray-100">
                    
                    {/* Blurry Atmospheric Cover Art Backdrop */}
                    <div className="absolute inset-0 pointer-events-none transition-opacity duration-1000 overflow-hidden z-0">
                        {cover ? (
                            <img src={cover} className="w-full h-full object-cover filter blur-[100px] opacity-25 scale-110" />
                        ) : (
                            <div className="w-full h-full bg-gradient-to-tr from-[#1b1220] via-[#0d0d12] to-[#121c25]"></div>
                        )}
                    </div>

                    {/* Glass Header */}
                    <div className="px-6 pb-2 flex justify-between items-center z-10 bg-black/10 backdrop-blur-xs border-b border-white/5 shadow-sm" style={{ paddingTop: "calc(env(safe-area-inset-top, 0px) + 20px)" }}>
                        <button onClick={onBack} className="p-2.5 text-gray-400 hover:text-white bg-white/5 hover:bg-white/10 border border-white/10 rounded-full transition active:scale-90 shadow-lg">
                            <Icon name="chevron-down" size={16} />
                        </button>
                        <span className="text-[10px] font-bold text-gray-400 uppercase tracking-[0.25em] font-sans">Now Narrating</span>
                        <button onClick={() => setShowList(true)} className="p-2.5 text-gray-400 hover:text-white bg-white/5 hover:bg-white/10 border border-white/10 rounded-full transition active:scale-90 shadow-lg">
                            <Icon name="list" size={16} />
                        </button>
                    </div>

                    {/* Center Column Container */}
                    <div className="flex-1 flex flex-col items-center justify-center p-6 md:p-8 space-y-6 md:space-y-8 z-10">
                        
                        {/* Immersive Book Cover Art Card */}
                        <div className={`aspect-[3/4] max-w-[240px] md:max-w-[270px] w-full rounded-2xl overflow-hidden relative shadow-[0_24px_50px_rgba(0,0,0,0.7)] border border-white/10 transition-all duration-500 ease-out book-sheen ${
                            playing ? 'scale-[1.03] shadow-[0_30px_60px_rgba(0,0,0,0.8)]' : 'scale-95'
                        }`}>
                            {/* Left spine shadow overlay */}
                            <div className="absolute left-0 top-0 bottom-0 w-3 bg-black/35 z-20 border-r border-white/5 shadow-[2px_0_5px_rgba(0,0,0,0.4)]"></div>
                            {cover ? (
                                <img src={cover} className="w-full h-full object-cover relative z-10" />
                            ) : (
                                <div className="w-full h-full flex flex-col items-center justify-center bg-[#1c1b22] text-gray-500 relative z-10 p-4">
                                    <Icon name="book" size={48} className="opacity-30 mb-2" />
                                    <span className="font-serif text-sm text-center opacity-50 px-2 line-clamp-3">{book.title}</span>
                                </div>
                            )}
                        </div>

                        {/* Literary Meta Data */}
                        <div className="text-center w-full max-w-sm px-4">
                            <h2 className="font-serif text-2xl md:text-3xl font-bold truncate text-white leading-tight">{book.title}</h2>
                            <p className="font-sans text-[11px] font-bold text-gray-400 uppercase tracking-[0.2em] mt-1.5">{book.author}</p>
                            <div className="border border-white/10 bg-white/5 text-gray-300 text-xs font-semibold px-4 py-2 rounded-full inline-block mt-4 truncate max-w-full font-sans tracking-wide">
                                {currentTrack?.name || "No audio narrative loaded"}
                            </div>
                        </div>

                        {/* Range Slider Container */}
                        <div className="w-full max-w-sm px-6">
                            <input 
                                type="range" 
                                min="0" max={trackDur || 1} 
                                value={Math.max(0, sliderVal)} 
                                onChange={(e) => { 
                                    const seekTime = Number(e.target.value) + trackStart;
                                    audioRef.current.currentTime = seekTime; 
                                    setTime(seekTime); 
                                }}
                                className="w-full"
                            />
                            <div className="flex justify-between text-[10px] font-bold uppercase tracking-widest text-gray-400 mt-2.5 font-mono">
                                <span>{formatTime(sliderVal)}</span>
                                <span>-{formatTime(trackDur - sliderVal)}</span>
                            </div>
                        </div>

                        {/* Player controls */}
                        <div className="flex items-center justify-between w-full max-w-xs px-8">
                            <button onClick={() => audioRef.current.currentTime -= 30} className="text-gray-400 hover:text-white transition flex flex-col items-center gap-1.5 active:scale-95">
                                <Icon name="rotate-ccw" size={24} /> 
                                <span className="text-[9px] font-bold uppercase tracking-wider opacity-60">30s</span>
                            </button>
                            <button 
                                onClick={() => { if(playing) audioRef.current.pause(); else audioRef.current.play(); setPlaying(!playing); }} 
                                className="w-18 h-18 bg-brand-red hover:bg-[#be2f31] text-white rounded-full flex items-center justify-center shadow-[0_0_25px_rgba(219,56,58,0.4)] hover:shadow-[0_0_35px_rgba(219,56,58,0.6)] hover:scale-105 active:scale-95 transition-all duration-300 ease-out"
                            >
                                <Icon name={playing ? "pause" : "play"} size={26} className={playing ? "" : "ml-1"} />
                            </button>
                            <button onClick={() => audioRef.current.currentTime += 300} className="text-gray-400 hover:text-white transition flex flex-col items-center gap-1.5 active:scale-95">
                                <Icon name="rotate-cw" size={24} /> 
                                <span className="text-[9px] font-bold uppercase tracking-wider opacity-60">5m</span>
                            </button>
                        </div>
                    </div>

                    {/* Immersive Read Along Button Panel */}
                    {book.epubId && (
                        <div className="safe-bottom pb-8 flex justify-center z-10">
                             <button onClick={() => setShowReader(true)} className="flex items-center gap-2.5 bg-white/10 hover:bg-white/15 border border-white/15 hover:border-white/20 px-6 py-3 rounded-full shadow-lg text-[10px] font-bold uppercase tracking-[0.2em] text-white hover:scale-[1.02] active:scale-95 transition-all duration-300 backdrop-blur">
                                <Icon name="book-open" size={14} /> Read Along
                            </button>
                        </div>
                    )}

                    {/* Chapters Drawer Modal */}
                    {showList && (
                        <div className="absolute inset-0 z-20 bg-black/60 backdrop-blur-xs flex flex-col justify-end" onClick={() => setShowList(false)}>
                            <div className="bg-[#121115]/95 border-t border-white/10 backdrop-blur-lg rounded-t-3xl max-h-[70vh] flex flex-col p-6 shadow-2xl w-full max-w-lg md:mx-auto animate-in slide-in-from-bottom duration-300" onClick={e => e.stopPropagation()}>
                                <h3 className="font-serif text-xl font-bold border-b border-white/5 pb-3 text-white mb-4">Audio Narrations</h3>
                                <div className="overflow-y-auto flex-1 no-scrollbar">
                                    {book.tracks.map((t, i) => (
                                        <div 
                                            key={i} 
                                            onClick={() => { changeTrack(i); setShowList(false); }} 
                                            className={`p-3.5 rounded-xl mb-1.5 flex items-center gap-3 transition cursor-pointer ${
                                                i === book.currentTrackIndex 
                                                    ? 'bg-brand-red text-white font-semibold shadow-md' 
                                                    : 'text-gray-400 hover:bg-white/5 hover:text-white'
                                            }`}
                                        >
                                            <span className="font-mono text-xs w-6 opacity-60">{i + 1}</span>
                                            <span className="truncate text-sm font-sans font-semibold tracking-wide">{t.name}</span>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        </div>
                    )}
                    
                    {showReader && <EpubReader bookId={bookId} onClose={async () => {
                        setShowReader(false);
                        const b = await dbOp('readonly', 'books', s => s.get(bookId));
                        setBook(b);
                    }} />}
                    
                    <audio 
                        ref={audioRef} 
                        onTimeUpdate={handleTimeUpdate} 
                        onEnded={() => { if(book.currentTrackIndex >= book.tracks.length - 1) setPlaying(false); }}
                        onError={(e) => console.log("Audio Error", e)}
                    />
                </div>
            );
        };

        const App = () => {
            const [view, setView] = useState('library'); 
            const [activeBookId, setActiveBookId] = useState(null);
            const [editingBookId, setEditingBookId] = useState(null);
            const [isEditing, setIsEditing] = useState(false);
            const [showSettings, setShowSettings] = useState(false);
            const [books, setBooks] = useState([]);
            const [covers, setCovers] = useState({});

            const loadLibrary = async () => {
                const list = await dbOp('readonly', 'books', s => s.getAll());
                setBooks(list);
                list.forEach(async b => {
                    if (b.coverId && !covers[b.id]) {
                        const f = await dbOp('readonly', 'files', s => s.get(b.coverId));
                        if(f) setCovers(prev => ({...prev, [b.id]: URL.createObjectURL(f.data)}));
                    }
                });
            };

            useEffect(() => { loadLibrary(); }, []);

            return (
                <div className="relative h-full w-full bg-[#09080a] text-gray-100 overflow-hidden font-sans">
                    
                    {/* Animated Ambient Light Gradients */}
                    <div className="absolute inset-0 overflow-hidden pointer-events-none z-0">
                        <div className="absolute top-[-20%] left-[-10%] w-[60%] aspect-square rounded-full bg-[#3b1c2e]/20 blur-[130px] animate-float-1"></div>
                        <div className="absolute bottom-[-10%] right-[-10%] w-[55%] aspect-square rounded-full bg-[#1b2b3a]/30 blur-[140px] animate-float-2"></div>
                        <div className="absolute top-[30%] right-[15%] w-[35%] aspect-square rounded-full bg-brand-red/5 blur-[100px] animate-pulse"></div>
                    </div>
                    
                    {/* Main Content viewport */}
                    <div className="relative z-10 h-full w-full overflow-hidden">
                        {view === 'library' && (
                            <div className="h-full p-6 safe-top overflow-y-auto no-scrollbar relative">
                                <header className="flex justify-between items-end mb-10 border-b border-white/5 pb-4">
                                    <div>
                                        <h1 className="font-serif text-3xl md:text-4xl font-bold tracking-tight text-white">THE FOLIO</h1>
                                        <p className="font-sans text-[10px] uppercase tracking-[0.25em] text-gray-400 mt-1 font-semibold">Audiobook Atelier</p>
                                    </div>
                                    <div className="flex gap-3">
                                        <button 
                                            onClick={() => setShowSettings(true)} 
                                            className="bg-white/5 border border-white/10 hover:bg-white/10 hover:border-white/20 text-gray-300 rounded-full p-2.5 shadow-lg transition duration-200 active:scale-95"
                                            title="Settings"
                                        >
                                            <Icon name="settings" size={18} />
                                        </button>
                                        <button 
                                            onClick={() => { setEditingBookId(null); setIsEditing(true); }} 
                                            className="bg-brand-red text-white hover:bg-[#be2f31] hover:shadow-[0_0_15px_rgba(217,56,58,0.4)] rounded-full p-2.5 shadow-lg transition duration-200 active:scale-95"
                                            title="Add New Book"
                                        >
                                            <Icon name="plus" size={18} />
                                        </button>
                                    </div>
                                </header>

                                <div className="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-6 pb-24">
                                    {books.map(b => (
                                        <div key={b.id} onClick={() => { setActiveBookId(b.id); setView('player'); }} className="relative group cursor-pointer flex flex-col">
                                            
                                            {/* Physical Book Cover Card */}
                                            <div className="aspect-[3/4] bg-neutral-900 rounded-lg shadow-[0_12px_24px_rgba(0,0,0,0.5)] border border-white/5 overflow-hidden relative group-hover:scale-[1.03] group-hover:shadow-[0_16px_32px_rgba(0,0,0,0.6)] group-hover:border-white/15 transition-all duration-300 ease-out book-sheen">
                                                
                                                {/* Spine fold hinge simulation */}
                                                <div className="absolute left-0 top-0 bottom-0 w-2.5 bg-black/35 z-20 border-r border-white/5 shadow-[2px_0_5px_rgba(0,0,0,0.4)]"></div>
                                                
                                                {covers[b.id] ? (
                                                    <img src={covers[b.id]} className="w-full h-full object-cover relative z-10" />
                                                ) : (
                                                    <div className="w-full h-full flex flex-col items-center justify-center bg-[#18171c] text-gray-500 relative z-10 p-4">
                                                        <Icon name="book" size={32} className="opacity-40 mb-2" />
                                                        <span className="font-serif text-xs text-center opacity-60 px-2 line-clamp-3 leading-tight">{b.title}</span>
                                                    </div>
                                                )}
                                                
                                                {/* Edit overlay action */}
                                                <button 
                                                    onClick={(e) => { e.stopPropagation(); setEditingBookId(b.id); setIsEditing(true); }}
                                                    className="absolute top-3 right-3 bg-brand-red hover:bg-[#be2f31] text-white p-2 rounded-full shadow-lg opacity-0 group-hover:opacity-100 transition-opacity duration-200 z-30 shadow-black/30"
                                                    title="Edit Book"
                                                >
                                                    <Icon name="pencil" size={14} />
                                                </button>
                                            </div>
                                            
                                            <h3 className="font-serif text-base font-semibold text-gray-100 group-hover:text-brand-red transition-colors duration-200 truncate mt-3 leading-tight">{b.title}</h3>
                                            <p className="font-sans text-[10px] font-bold text-gray-400 uppercase tracking-widest truncate mt-1">{b.author}</p>
                                        </div>
                                    ))}
                                    {books.length === 0 && (
                                        <div className="col-span-2 sm:col-span-3 md:col-span-4 flex flex-col items-center justify-center py-20 text-gray-500">
                                            <Icon name="book-open" size={48} className="opacity-25 mb-4" />
                                            <p className="font-serif text-lg italic mb-2">The shelves are empty.</p>
                                            <button 
                                                onClick={() => { setEditingBookId(null); setIsEditing(true); }}
                                                className="font-sans text-xs uppercase tracking-widest text-brand-red font-bold hover:underline"
                                            >
                                                Create your first book
                                            </button>
                                        </div>
                                    )}
                                </div>
                            </div>
                        )}

                        {view === 'player' && <Player bookId={activeBookId} onBack={() => setView('library')} />}
                    </div>
                    
                    {isEditing && (
                        <BookEditor 
                            bookId={editingBookId} 
                            onClose={() => setIsEditing(false)} 
                            onSave={() => { setIsEditing(false); loadLibrary(); }} 
                            onDelete={() => { setIsEditing(false); loadLibrary(); }}
                        />
                    )}

                    {showSettings && <SettingsModal onClose={() => setShowSettings(false)} />}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
