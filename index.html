                                        </div>
                                    ))}
                                </div>
                            </div>
                        </div>
                    )}
                    
                    {showReader && <EpubReader bookId={bookId} onClose={() => setShowReader(false)} />}
                    
                    <audio 
                        ref={audioRef} 
                        onTimeUpdate={handleTimeUpdate} 
                        onEnded={() => { if(book.currentTrackIndex >= book.tracks.length - 1) setPlaying(false); }}
                        onError={(e) => console.log("Audio Error", e)}
                    />
                </div>
            );
        };

        const App = () => {
            const [view, setView] = useState('library'); 
            const [activeBookId, setActiveBookId] = useState(null);
            const [editingBookId, setEditingBookId] = useState(null);
            const [isEditing, setIsEditing] = useState(false);
            const [showSettings, setShowSettings] = useState(false);
            const [books, setBooks] = useState([]);
            const [covers, setCovers] = useState({});

            const loadLibrary = async () => {
                const list = await dbOp('readonly', 'books', s => s.getAll());
                setBooks(list);
                list.forEach(async b => {
                    if (b.coverId && !covers[b.id]) {
                        const f = await dbOp('readonly', 'files', s => s.get(b.coverId));
                        if(f) setCovers(prev => ({...prev, [b.id]: URL.createObjectURL(f.data)}));
                    }
                });
            };

            useEffect(() => { loadLibrary(); }, []);

            return (
                <div className="relative h-full w-full bg-[#09080a] text-gray-100 overflow-hidden font-sans">
                    
                    {/* Animated Ambient Light Gradients */}
                    <div className="absolute inset-0 overflow-hidden pointer-events-none z-0">
                        <div className="absolute top-[-20%] left-[-10%] w-[60%] aspect-square rounded-full bg-[#3b1c2e]/20 blur-[130px] animate-float-1"></div>
                        <div className="absolute bottom-[-10%] right-[-10%] w-[55%] aspect-square rounded-full bg-[#1b2b3a]/30 blur-[140px] animate-float-2"></div>
                        <div className="absolute top-[30%] right-[15%] w-[35%] aspect-square rounded-full bg-brand-red/5 blur-[100px] animate-pulse"></div>
                    </div>
                    
                    {/* Main Content viewport */}
                    <div className="relative z-10 h-full w-full overflow-hidden">
                        {view === 'library' && (
                            <div className="h-full p-6 safe-top overflow-y-auto no-scrollbar relative">
                                <header className="flex justify-between items-end mb-10 border-b border-white/5 pb-4">
                                    <div>
                                        <h1 className="font-serif text-3xl md:text-4xl font-bold tracking-tight text-white">THE FOLIO</h1>
                                        <p className="font-sans text-[10px] uppercase tracking-[0.25em] text-gray-400 mt-1 font-semibold">Audiobook Atelier</p>
                                    </div>
                                    <div className="flex gap-3">
                                        <button 
                                            onClick={() => setShowSettings(true)} 
                                            className="bg-white/5 border border-white/10 hover:bg-white/10 hover:border-white/20 text-gray-300 rounded-full p-2.5 shadow-lg transition duration-200 active:scale-95"
                                            title="Settings"
                                        >
                                            <Icon name="settings" size={18} />
                                        </button>
                                        <button 
                                            onClick={() => { setEditingBookId(null); setIsEditing(true); }} 
                                            className="bg-brand-red text-white hover:bg-[#be2f31] hover:shadow-[0_0_15px_rgba(217,56,58,0.4)] rounded-full p-2.5 shadow-lg transition duration-200 active:scale-95"
                                            title="Add New Book"
                                        >
                                            <Icon name="plus" size={18} />
                                        </button>
                                    </div>
                                </header>

                                <div className="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-6 pb-24">
                                    {books.map(b => (
                                        <div key={b.id} onClick={() => { setActiveBookId(b.id); setView('player'); }} className="relative group cursor-pointer flex flex-col">
                                            
                                            {/* Physical Book Cover Card */}
                                            <div className="aspect-[3/4] bg-neutral-900 rounded-lg shadow-[0_12px_24px_rgba(0,0,0,0.5)] border border-white/5 overflow-hidden relative group-hover:scale-[1.03] group-hover:shadow-[0_16px_32px_rgba(0,0,0,0.6)] group-hover:border-white/15 transition-all duration-300 ease-out book-sheen">
                                                
                                                {/* Spine fold hinge simulation */}
                                                <div className="absolute left-0 top-0 bottom-0 w-2.5 bg-black/35 z-20 border-r border-white/5 shadow-[2px_0_5px_rgba(0,0,0,0.4)]"></div>
                                                
                                                {covers[b.id] ? (
                                                    <img src={covers[b.id]} className="w-full h-full object-cover relative z-10" />
                                                ) : (
                                                    <div className="w-full h-full flex flex-col items-center justify-center bg-[#18171c] text-gray-500 relative z-10 p-4">
                                                        <Icon name="book" size={32} className="opacity-40 mb-2" />
                                                        <span className="font-serif text-xs text-center opacity-60 px-2 line-clamp-3 leading-tight">{b.title}</span>
                                                    </div>
                                                )}
                                                
                                                {/* Edit overlay action */}
                                                <button 
                                                    onClick={(e) => { e.stopPropagation(); setEditingBookId(b.id); setIsEditing(true); }}
                                                    className="absolute top-3 right-3 bg-brand-red hover:bg-[#be2f31] text-white p-2 rounded-full shadow-lg opacity-0 group-hover:opacity-100 transition-opacity duration-200 z-30 shadow-black/30"
                                                    title="Edit Book"
                                                >
                                                    <Icon name="pencil" size={14} />
                                                </button>
                                            </div>
                                            
                                            <h3 className="font-serif text-base font-semibold text-gray-100 group-hover:text-brand-red transition-colors duration-200 truncate mt-3 leading-tight">{b.title}</h3>
                                            <p className="font-sans text-[10px] font-bold text-gray-400 uppercase tracking-widest truncate mt-1">{b.author}</p>
                                        </div>
                                    ))}
                                    {books.length === 0 && (
                                        <div className="col-span-2 sm:col-span-3 md:col-span-4 flex flex-col items-center justify-center py-20 text-gray-500">
                                            <Icon name="book-open" size={48} className="opacity-25 mb-4" />
                                            <p className="font-serif text-lg italic mb-2">The shelves are empty.</p>
                                            <button 
                                                onClick={() => { setEditingBookId(null); setIsEditing(true); }}
                                                className="font-sans text-xs uppercase tracking-widest text-brand-red font-bold hover:underline"
                                            >
                                                Create your first book
                                            </button>
                                        </div>
                                    )}
                                </div>
                            </div>
                        )}

                        {view === 'player' && <Player bookId={activeBookId} onBack={() => setView('library')} />}
                    </div>
                    
                    {isEditing && (
                        <BookEditor 
                            bookId={editingBookId} 
                            onClose={() => setIsEditing(false)} 
                            onSave={() => { setIsEditing(false); loadLibrary(); }} 
                            onDelete={() => { setIsEditing(false); loadLibrary(); }}
                        />
                    )}

                    {showSettings && <SettingsModal onClose={() => setShowSettings(false)} />}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
