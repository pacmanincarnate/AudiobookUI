        .light-slider::-webkit-slider-runnable-track {

        select { -webkit-appearance: none; appearance: none; }

        .book-sheen::after {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(135deg, rgba(255,255,255,0.08) 0%, rgba(255,255,255,0) 50%, rgba(0,0,0,0.15) 100%);
            pointer-events: none;

        .lit-drop-cap::first-letter {
            font-family: 'Cormorant Garamond', Georgia, serif;
            float: left;
            font-size: 3.5rem;

<body class="bg-[#09080a] text-gray-100 h-screen w-screen overflow-hidden select-none font-sans antialiased">
    <div id="root" class="h-full w-full"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef, useCallback, useMemo } = React;

        // --- GEMINI API CONFIG ---
        const getEffectiveApiKey = () => localStorage.getItem('gemini_api_key') || '';

        // --- UTILS ---
        const pcmToWav = (pcmData, sampleRate = 24000) => {
            const buffer = new ArrayBuffer(44 + pcmData.byteLength);
            const view = new DataView(buffer);
            const writeString = (offset, string) => { for (let i = 0; i < string.length; i++) view.setUint8(offset + i, string.charCodeAt(i)); };
            writeString(0, 'RIFF'); view.setUint32(4, 36 + pcmData.byteLength, true); writeString(8, 'WAVE'); writeString(12, 'fmt ');
            view.setUint32(16, 16, true); view.setUint16(20, 1, true); view.setUint16(22, 1, true); view.setUint32(24, sampleRate, true);
            view.setUint32(28, sampleRate * 2, true); view.setUint16(32, 2, true); view.setUint16(34, 16, true); writeString(36, 'data');
            view.setUint32(40, pcmData.byteLength, true);
            const pcmView = new Uint8Array(pcmData);
            const wavView = new Uint8Array(buffer, 44);
            wavView.set(pcmView);
            return buffer;
        };

        const chunkText = (text, maxLength = 3900) => {
            const chunks = [];
            let currentText = text;
            while (currentText.length > 0) {
                if (currentText.length <= maxLength) {
                    chunks.push(currentText);
                    break;
                }
                let splitIndex = currentText.lastIndexOf('.', maxLength);
                if (splitIndex === -1 || splitIndex < maxLength / 2) splitIndex = currentText.lastIndexOf('?', maxLength);
                if (splitIndex === -1 || splitIndex < maxLength / 2) splitIndex = currentText.lastIndexOf('!', maxLength);
                if (splitIndex === -1 || splitIndex < maxLength / 2) splitIndex = currentText.lastIndexOf('"', maxLength);
                if (splitIndex === -1 || splitIndex < maxLength / 2) splitIndex = currentText.lastIndexOf(' ', maxLength);
                if (splitIndex === -1) splitIndex = maxLength;

                chunks.push(currentText.substring(0, splitIndex + 1));
                currentText = currentText.substring(splitIndex + 1).trim();
            }
            return chunks;
        };

        const callGeminiTTS = async (text) => {
            const key = getEffectiveApiKey();
            if (!key) throw new Error("API Key missing");
            const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-exp-tts-2025-05-19:generateContent?key=${key}`;
            const payload = { contents: [{ parts: [{ text }] }], generationConfig: { responseModalities: ["AUDIO"], speechConfig: { voiceConfig: { prebuiltVoiceConfig: { voiceName: "Kore" } } } } };
            const response = await fetch(url, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(payload) });
            if (!response.ok) {
                const err = await response.json();
                throw new Error(err.error?.message || "TTS API Error");
            }
            const data = await response.json();
            const base64Audio = data.candidates?.[0]?.content?.parts?.[0]?.inlineData?.data;
            if (!base64Audio) throw new Error("No audio returned");
            
            const binaryString = window.atob(base64Audio);
            const len = binaryString.length;
            const bytes = new Uint8Array(len);
            for (let i = 0; i < len; i++) bytes[i] = binaryString.charCodeAt(i);
            const wavBuffer = pcmToWav(bytes.buffer);
            return URL.createObjectURL(new Blob([wavBuffer], { type: 'audio/wav' }));
        };

        const callGeminiSummary = async (text) => {
            const key = getEffectiveApiKey();
            if (!key) throw new Error("API Key missing");
            const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${key}`;
            const payload = { contents: [{ parts: [{ text: "Summarize this chapter concisely:\n\n" + text.substring(0, 10000) }] }] };
            const response = await fetch(url, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(payload) });
            if (!response.ok) throw new Error("Summary API Error");
            const data = await response.json();
            return data.candidates?.[0]?.content?.parts?.[0]?.text || "No summary generated.";
        };

        // --- DB LAYER ---
        const DB_NAME = 'AudiobookManagerDB';
        const DB_VERSION = 2; 
        const openDB = () => new Promise((resolve, reject) => {
            const req = indexedDB.open(DB_NAME, DB_VERSION);
            req.onerror = () => reject('DB Error');
            req.onupgradeneeded = (e) => {
                const db = e.target.result;
                if (!db.objectStoreNames.contains('books')) db.createObjectStore('books', { keyPath: 'id' });
                if (!db.objectStoreNames.contains('files')) db.createObjectStore('files', { keyPath: 'id' });
            };
            req.onsuccess = (e) => resolve(e.target.result);
        });
        const dbOp = async (mode, store, cb) => {
            const db = await openDB();
            return new Promise((resolve, reject) => {
                const tx = db.transaction(store, mode);
                const req = cb(tx.objectStore(store));
                req.onsuccess = () => resolve(req.result);
                req.onerror = () => reject(req.error);
            });
        };
        const patchBook = async (bookId, updates) => {
            const db = await openDB();
            const tx = db.transaction('books', 'readwrite');
            const store = tx.objectStore('books');
            const book = await new Promise((resolve, reject) => { const req = store.get(bookId); req.onsuccess = () => resolve(req.result); req.onerror = () => reject(req.error); });
            if (!book) return;
            store.put({ ...book, ...updates });
            return new Promise(resolve => tx.oncomplete = resolve);
        };
        const saveFiles = async (files) => {
            const db = await openDB();
            const tx = db.transaction('files', 'readwrite');
            const store = tx.objectStore('files');
            files.forEach(f => store.put(f));
            return new Promise(resolve => tx.oncomplete = resolve);
        };
        
        // Deep delete helper
        const deleteBookDeep = async (bookId) => {
            const db = await openDB();
            return new Promise((resolve, reject) => {
                const tx = db.transaction(['books', 'files'], 'readwrite');
                const booksStore = tx.objectStore('books');
                const filesStore = tx.objectStore('files');

                // 1. Get the book first
                const req = booksStore.get(bookId);
                
                req.onsuccess = () => {
                    const book = req.result;
                    if (!book) {
                        resolve();
                        return;
                    }

                    // 2. Delete Cover
                    if (book.coverId) filesStore.delete(book.coverId);

                    // 3. Delete EPUB
                    if (book.epubId) filesStore.delete(book.epubId);

                    // 4. Delete Audio Files
                    if (book.tracks && Array.isArray(book.tracks)) {
                        book.tracks.forEach(track => {
                            if (track.fileId) filesStore.delete(track.fileId);
                        });
                    }

                    // 5. Delete Book Record
                    booksStore.delete(bookId);
                };

                req.onerror = () => reject(req.error);
                tx.oncomplete = () => resolve();
                tx.onerror = () => reject(tx.error);
            });
        };

        const Icon = ({ name, size = 24, className = "" }) => {
            useEffect(() => lucide.createIcons(), [name]);
            return <i data-lucide={name} width={size} height={size} className={className}></i>;
        };

        const formatTime = (s) => {
            if (!s || isNaN(s)) return "0:00";
            const m = Math.floor(s / 60);
            const sec = Math.floor(s % 60);
            return `${m}:${sec.toString().padStart(2, '0')}`;
        };

        // --- COMPONENTS ---

        const LoadingToast = ({ message, onCancel }) => (
            <div className="fixed bottom-24 left-1/2 transform -translate-x-1/2 z-[80] bg-[#121115]/95 border border-white/15 backdrop-blur-md text-white px-6 py-3 rounded-full shadow-2xl flex items-center gap-3 animate-[slideUp_0.3s_ease-out] w-auto max-w-[90%]">
                <div className="animate-spin rounded-full h-3.5 w-3.5 border-2 border-white/30 border-t-brand-red"></div>
                <span className="text-xs font-sans font-semibold tracking-wide">{message}</span>
                {onCancel && (
                    <button onClick={onCancel} className="ml-2 hover:text-brand-red rounded-full p-0.5 transition">
                        <Icon name="x" size={12} />
                    </button>
                )}
            </div>
        );

        const SettingsModal = ({ onClose }) => {
            const [key, setKey] = useState(getEffectiveApiKey());
            return (
                <div className="fixed inset-0 z-[70] flex items-center justify-center bg-black/75 backdrop-blur-sm p-4 animate-in fade-in">
                    <div className="bg-[#121115]/95 border border-white/10 text-gray-100 rounded-3xl w-full max-w-sm p-6 shadow-2xl">
                        <h3 className="font-serif text-xl font-bold mb-4 text-center">Settings</h3>
                        <label className="block text-xs font-bold uppercase tracking-widest text-gray-400 mb-2">Google Gemini API Key</label>
                        <input 
                            type="password" 
                            value={key} 
                            onChange={e => setKey(e.target.value)} 
                            placeholder="AIzaSy..." 
                            className="w-full p-3 bg-white/5 border border-white/10 focus:border-brand-red focus:ring-1 focus:ring-brand-red rounded-xl outline-none font-mono text-sm text-white mb-3" 
                        />
                        <p className="text-[11px] text-gray-400 mb-6 leading-relaxed font-serif italic text-center">Required to enable the AI Narrator and Chapter Summarization features.</p>
                        <div className="flex gap-3">
                            <button onClick={onClose} className="flex-1 py-2.5 text-gray-400 hover:text-white font-sans text-xs font-bold uppercase tracking-widest border border-white/10 rounded-xl hover:bg-white/5 transition">Cancel</button>
                            <button onClick={() => { localStorage.setItem('gemini_api_key', key); onClose(); }} className="flex-1 py-2.5 bg-brand-red hover:bg-[#be2f31] text-white font-sans text-xs font-bold uppercase tracking-widest rounded-xl shadow-lg transition">Save</button>
                        </div>
                    </div>
                </div>
            );
        };

        const AIModal = ({ type, content, onClose }) => {
            return (
                <div className="fixed inset-0 z-[60] flex items-center justify-center bg-black/70 backdrop-blur-sm p-6 animate-in fade-in">
                    <div className="bg-[#121115]/95 border border-white/10 text-gray-100 rounded-3xl w-full max-w-lg shadow-2xl flex flex-col max-h-[80vh] overflow-hidden">
                        <div className="p-4 border-b border-white/5 flex items-center gap-2">
                            <Icon name={type === 'summary' ? 'sparkles' : 'mic'} className="text-brand-red" />
                            <h3 className="font-serif font-bold text-lg">{type === 'summary' ? 'Chapter Summary' : 'AI Narrator'}</h3>
                        </div>
                        <div className="p-6 overflow-y-auto font-serif text-base leading-relaxed text-gray-300">
                            {content ? (
                                <p className="whitespace-pre-wrap">{content}</p>
                            ) : (
                                <div className="flex flex-col items-center justify-center py-12">
                                    <div className="animate-spin rounded-full h-8 w-8 border-b-2 border-brand-red mb-4"></div>
                                    <p className="text-gray-400 italic animate-pulse">Consulting the AI...</p>
                                </div>
                            )}
                        </div>
                        <div className="p-4 border-t border-white/5 bg-white/5">
                            <button onClick={onClose} className="w-full py-3 bg-white/5 border border-white/10 hover:bg-white/10 rounded-xl font-sans text-xs font-bold uppercase tracking-widest text-white transition">Close</button>
                        </div>
                    </div>
                </div>
            );
        };

        const EpubReader = ({ bookId, onClose }) => {
            const viewerRef = useRef(null);
            const [book, setBook] = useState(null);
            const [rendition, setRendition] = useState(null);
            const [toc, setToc] = useState([]);
            const [progress, setProgress] = useState(0);
            const [ready, setReady] = useState(false);
            const [showTOC, setShowTOC] = useState(false);
            const [showAppearance, setShowAppearance] = useState(false);
            const [aiModal, setAiModal] = useState(null);
            const [summaryText, setSummaryText] = useState(null);
            const [isReadingAloud, setIsReadingAloud] = useState(false);
            const [loadingAudio, setLoadingAudio] = useState(false);
            const [scanning, setScanning] = useState(false);
            const [isEditingTOC, setIsEditingTOC] = useState(false);
            const audioPlayerRef = useRef(new Audio());
            
            // TTS Queue Refs
            const ttsQueue = useRef([]);
            const ttsIndex = useRef(0);

            const fontOptions = [
                { label: 'Cormorant Garamond (Literary)', value: '"Cormorant Garamond", Georgia, serif' },
                { label: 'System UI', value: '-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif' },
                { label: 'Helvetica Neue', value: '"Helvetica Neue", Helvetica, Arial, sans-serif' },
                { label: 'Verdana', value: 'Verdana, Geneva, sans-serif' },
                { label: 'Lato', value: 'Lato, sans-serif' },
                { label: 'Charter', value: 'Charter, "Bitstream Charter", serif' },
                { label: 'Georgia', value: 'Georgia, serif' },
                { label: 'Iowan Old Style', value: '"Iowan Old Style", serif' },
                { label: 'Times New Roman', value: '"Times New Roman", Times, serif' },
            ];

            const [settings, setSettings] = useState(() => {
                const saved = localStorage.getItem('reader_settings');
                return saved ? JSON.parse(saved) : {
                    theme: 'light',
                    fontSize: 100,
                    fontFamily: '"Cormorant Garamond", Georgia, serif',
                    lineHeight: 1.6,
                    dialogueEnhance: false,
                    textColor: '#1c1917'
                };
            });

            useEffect(() => { localStorage.setItem('reader_settings', JSON.stringify(settings)); }, [settings]);
            
            const updateSetting = (key, value) => {
                if (key === 'theme') {
                    const textColors = {
                        light: '#1C1917',
                        sepia: '#433422',
                        dark: '#E2E2E6'
                    };
                    setSettings(prev => ({ ...prev, theme: value, textColor: textColors[value] }));
                } else {
                    setSettings(prev => ({ ...prev, [key]: value }));
                }
            };

            useEffect(() => {
                const init = async () => {
                    if (!bookId) return;
                    const bookMeta = await dbOp('readonly', 'books', s => s.get(bookId));
                    if (!bookMeta || !bookMeta.epubId) return;
                    const f = await dbOp('readonly', 'files', s => s.get(bookMeta.epubId));
                    if (!f) return;
                    
                    const newBook = ePub(f.data);
                    setBook(newBook);
                    const rend = newBook.renderTo(viewerRef.current, { width: "100%", height: "100%", flow: "paginated" });
                    setRendition(rend);

                    rend.hooks.content.register((contents) => {
                        const doc = contents.document;
                        
                        // Load Cormorant Google Fonts in the EPUB iframe
                        const link = doc.createElement('link');
                        link.rel = 'stylesheet';
                        link.href = 'https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;0,700;1,400&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap';
                        doc.head.appendChild(link);

                        const style = doc.createElement('style');
                        style.textContent = `
                            .dialogue-text { display: inline; color: inherit; }
                            body { font-family: 'Cormorant Garamond', Georgia, serif; line-height: 1.6; }
                            p { line-height: 1.7 !important; margin-bottom: 1.25em !important; text-align: justify; }
                        `; 
                        doc.head.appendChild(style);

                        const walker = doc.createTreeWalker(doc.body, NodeFilter.SHOW_TEXT, null, false);
                        const nodes = [];
                        while(walker.nextNode()) nodes.push(walker.currentNode);

                        const regex = /([“"”][^"”]*[”"“])|("[^"]*")/g; 

                        nodes.forEach(node => {
                            if (!node.nodeValue || node.parentElement.tagName === 'SCRIPT' || node.parentElement.tagName === 'STYLE') return;
                            const text = node.nodeValue;
                            if (!regex.test(text)) return;
                            
                            regex.lastIndex = 0;
                            const fragment = doc.createDocumentFragment();
                            let lastIndex = 0;
                            let match;

                            while ((match = regex.exec(text)) !== null) {
                                if (match.index > lastIndex) fragment.appendChild(document.createTextNode(text.substring(lastIndex, match.index)));
                                const span = doc.createElement('span');
                                span.className = 'dialogue-text';
                                span.textContent = match[0];
                                span.style.textShadow = 'var(--dialogue-shadow, none)';
                                fragment.appendChild(span);
                                lastIndex = regex.lastIndex;
                            }
                            if (lastIndex < text.length) fragment.appendChild(document.createTextNode(text.substring(lastIndex)));
                            node.parentNode.replaceChild(fragment, node);
                        });
                    });

                    const initialLocation = bookMeta.lastReadLocation || undefined;
                    await rend.display(initialLocation);
                    
                    newBook.ready.then(() => newBook.locations.generate(1000)).then(() => setReady(true));
                    
                    const navigation = await newBook.loaded.navigation;
                    if (bookMeta.customTOC) {
                        setToc(bookMeta.customTOC);
                    } else {
                        setToc(navigation.toc);
                    }

                    rend.themes.register('light', { body: { background: '#FAF6EE', color: '#1C1917' } });
                    rend.themes.register('sepia', { body: { background: '#F4ECD8', color: '#433422' } });
                    rend.themes.register('dark', { body: { background: '#0F0E12', color: '#E2E2E6' } });
                    
                    rend.on('relocated', (location) => {
                        setProgress(Math.floor(location.start.percentage * 100));
                        patchBook(bookId, { lastReadLocation: location.start.cfi });
                    });
                };
                init();
                return () => { 
                    if (audioPlayerRef.current) { 
                        audioPlayerRef.current.pause(); 
                        audioPlayerRef.current.src = ""; 
                        audioPlayerRef.current.onended = null;
                    } 
                };
            }, [bookId]);

            // Appearance Effect
            useEffect(() => {
                if(rendition) {
                    rendition.themes.select(settings.theme);
                    rendition.themes.fontSize(settings.fontSize + '%');
                    rendition.themes.font(settings.fontFamily);
                    const shadowStyle = settings.dialogueEnhance ? '0 0 2px currentColor' : 'none';
                    rendition.themes.register('custom-styles', { 
                        'body': { 
                            'color': `${settings.textColor} !important`,
                            'line-height': `${settings.lineHeight} !important`,
                            '--dialogue-shadow': shadowStyle
                        }
                    });
                    rendition.themes.select('custom-styles');
                }
            }, [settings, rendition]);

            // ... TOC & AI Functions ...
            const scanChapters = async () => {
                if (!book) return;
                setScanning(true);
                const newToc = [];
                try {
                    for (let i = 0; i < book.spine.length; i++) {
                        const item = book.spine.get(i);
                        const doc = await item.load(book.load.bind(book));
                        const titleEl = doc.querySelector('h1, h2, h3, .title, .chapter');
                        let label = "";
                        if (titleEl && titleEl.innerText.trim().length > 0 && titleEl.innerText.length < 100) {
                            label = titleEl.innerText.trim();
                        } else {
                            const pTags = doc.querySelectorAll('p');
                            for (let p of pTags) {
                                const text = p.innerText.trim();
                                if (/^(Chapter|Part|Prologue|Epilogue)\s+\d+/i.test(text) || /^\d+$/.test(text)) {
                                    if (text.length < 50) { label = text; break; }
                                }
                            }
                        }
                        if (label) newToc.push({ label: label, href: item.href });
                    }
                    if (newToc.length > 0) {
                        setToc(newToc);
                        await patchBook(bookId, { customTOC: newToc });
                        alert(`Found ${newToc.length} chapters.`);
                    } else {
                        alert("No chapters detected.");
                    }
                } catch (e) { console.error(e); alert("Scan failed."); } finally { setScanning(false); }
            };

            const updateTocItem = (index, newLabel) => {
                const newToc = [...toc];
                newToc[index] = { ...newToc[index], label: newLabel };
                setToc(newToc);
            };

            const saveTOC = async () => {
                await patchBook(bookId, { customTOC: toc });
                setIsEditingTOC(false);
            };

            const getVisibleText = () => {
                if (!rendition) return null;
                const visible = rendition.currentLocation();
                if (!visible || !visible.start || !visible.end) return null;
                try {
                    const range = rendition.getRange(visible.start.cfi, visible.end.cfi);
                    return range.toString();
                } catch(e) {
                    console.log("Range Error", e);
                    return null;
                }
            };

            const getCurrentChapterText = async () => {
                if (!rendition || !book) return null;
                const cfi = rendition.currentLocation().start.cfi;
                const item = book.spine.get(cfi);
                if (!item) return null;
                try {
                    const doc = await item.load(book.load.bind(book));
                    const body = doc.body || doc.querySelector('body') || doc.documentElement;
                    return body ? (body.innerText || body.textContent || "") : "";
                } catch (e) {
                    console.warn("Text extraction error", e);
                    return "";
                }
            };

            const handleSummary = async () => {
                setAiModal('summary'); setSummaryText(null);
                try {
                    const text = await getCurrentChapterText();
                    if (!text || text.length < 50) throw new Error("Could not extract enough text.");
                    const summary = await callGeminiSummary(text);
                    setSummaryText(summary);
                } catch (e) { setSummaryText("Error: " + e.message); }
            };

            const playNextChunk = async () => {
                if (!isReadingAloud) return; // Stopped
                if (ttsIndex.current >= ttsQueue.current.length) {
                    setIsReadingAloud(false);
                    return;
                }

                setLoadingAudio(true);
                const text = ttsQueue.current[ttsIndex.current];
                
                try {
                    const audioUrl = await callGeminiTTS(text);
                    audioPlayerRef.current.src = audioUrl;
                    
                    // Increment for next time
                    ttsIndex.current++;
                    
                    // Trigger next chunk when this one ends
                    audioPlayerRef.current.onended = () => {
                        // Small delay or direct? Direct is better for continuous
                        playNextChunk();
                    };
                    
                    await audioPlayerRef.current.play();
                    setLoadingAudio(false);
                } catch(e) {
                    console.error("Playback error", e);
                    setLoadingAudio(false);
                    setIsReadingAloud(false);
                    alert("Audio playback stopped: " + e.message);
                }
            };

            const handleTTS = async () => {
                if (isReadingAloud) { 
                    audioPlayerRef.current.pause(); 
                    setIsReadingAloud(false); 
                    setLoadingAudio(false); 
                    return; 
                }
                
                setLoadingAudio(true);
                
                try {
                    // 1. Get full text of chapter
                    const chapterText = await getCurrentChapterText();
                    if (!chapterText || chapterText.length < 10) {
                        alert("No text available to read.");
                        setLoadingAudio(false);
                        return;
                    }

                    // 2. Try to find where we are (visible text)
                    const visibleText = getVisibleText();
                    let startIdx = 0;
                    if (visibleText && visibleText.length > 20) {
                        // Sanitize for matching (remove newlines etc)
                        const searchStr = visibleText.substring(0, 50).replace(/\s+/g, ' ').trim();
                        // Find this in chapter text (normalized)
                        // Simple search first
                        startIdx = chapterText.indexOf(searchStr);
                        if (startIdx === -1) {
                            // Fallback: Just read from start of chapter if match fails
                            startIdx = 0;
                        }
                    }

                    const remainingText = chapterText.substring(startIdx);
                    
                    // 3. Chunk it
                    const chunks = chunkText(remainingText);
                    if (chunks.length === 0) {
                        alert("Text processing failed.");
                        setLoadingAudio(false);
                        return;
                    }

                    // 4. Setup Queue
                    ttsQueue.current = chunks;
                    ttsIndex.current = 0;
                    setIsReadingAloud(true);
                    
                    // 5. Start
                    playNextChunk();

                } catch (e) { 
                    alert("TTS Error: " + e.message); 
                    setIsReadingAloud(false); 
                    setLoadingAudio(false);
                }
            };

            const handleSlider = (e) => {
                const val = e.target.value; setProgress(val);
                if (book && book.locations.length() > 0) { const cfi = book.locations.cfiFromPercentage(val / 100); rendition.display(cfi); }
            };
            const nav = (dir) => { if(rendition) dir === 'next' ? rendition.next() : rendition.prev(); };

            return (
                <div className={`fixed inset-0 z-50 flex flex-col transition-colors duration-300 ${
                    settings.theme === 'dark' ? 'bg-[#0F0E12] text-gray-200' : 
                    (settings.theme === 'sepia' ? 'bg-[#F4ECD8] text-[#433422]' : 'bg-[#FAF6EE] text-[#1C1917]')
                }`}>
                    {/* Floating Top Header Bar */}
                    <div className={`mx-4 mt-4 h-12 rounded-full border px-4 flex items-center justify-between shadow-xl z-20 transition-all duration-300 ${
                        settings.theme === 'dark' ? 'bg-[#151419]/90 border-white/10 text-white shadow-black/40' : 
                        (settings.theme === 'sepia' ? 'bg-[#ebdcb9]/95 border-[#5f4b32]/15 text-[#433422] shadow-[#433422]/10' : 'bg-white/95 border-black/10 text-gray-900')
                    }`}>
                        <button onClick={onClose} className="font-serif text-sm font-semibold tracking-wide hover:opacity-75 transition">Close</button>
                        <div className="flex items-center gap-1.5">
                            <button onClick={handleTTS} className={`p-2 rounded-full transition ${isReadingAloud && !loadingAudio ? 'bg-brand-red text-white animate-pulse' : 'hover:bg-black/5'}`} title="AI Narrator"><Icon name="headphones" size={18} /></button>
                            <button onClick={handleSummary} className="p-2 rounded-full hover:bg-black/5 transition" title="Summarize"><Icon name="sparkles" size={18} /></button>
                            <div className={`w-px h-5 mx-1.5 ${settings.theme === 'dark' ? 'bg-white/10' : 'bg-black/10'}`}></div>
                            <button onClick={() => { setShowAppearance(!showAppearance); setShowTOC(false); }} className={`p-2 rounded-full hover:bg-black/5 transition ${showAppearance ? 'text-brand-red' : ''}`} title="Appearance"><Icon name="type" size={18} /></button>
                            <button onClick={() => { setShowTOC(!showTOC); setShowAppearance(false); }} className={`p-2 rounded-full hover:bg-black/5 transition ${showTOC ? 'text-brand-red' : ''}`} title="Table of Contents"><Icon name="list" size={18} /></button>
                        </div>
                    </div>

                    <div className="flex-1 relative overflow-hidden px-4 md:px-12 py-4">
                        {!ready && (
                            <div className="absolute inset-0 flex flex-col items-center justify-center gap-2 z-10">
                                <div className="animate-spin rounded-full h-8 w-8 border-b-2 border-brand-red"></div>
                                <div className="text-[10px] font-bold uppercase tracking-widest text-gray-500">Indexing Book...</div>
                            </div>
                        )}
                        <div ref={viewerRef} className="w-full h-full"></div>
                        <div className="absolute inset-y-0 left-0 w-16 md:w-24 z-0 cursor-west-resize" onClick={() => nav('prev')}></div>
                        <div className="absolute inset-y-0 right-0 w-16 md:w-24 z-0 cursor-east-resize" onClick={() => nav('next')}></div>
                    </div>

                    {/* Floating Bottom Progress Bar */}
                    <div className={`mx-4 mb-4 p-4 rounded-3xl border flex flex-col justify-center shadow-xl z-20 transition-all duration-300 ${
                        settings.theme === 'dark' ? 'bg-[#151419]/90 border-white/10 text-white shadow-black/40' : 
                        (settings.theme === 'sepia' ? 'bg-[#ebdcb9]/95 border-[#5f4b32]/15 text-[#433422] shadow-[#433422]/10' : 'bg-white/95 border-black/10 text-gray-900')
                    }`}>
                        <input 
                            type="range" 
                            min="0" max="100" step="1" 
                            value={progress} 
                            onChange={handleSlider} 
                            className={`w-full h-1 mb-2 cursor-pointer ${settings.theme !== 'dark' ? 'light-slider' : ''}`} 
                        />
                        <div className="flex justify-between text-[9px] font-bold uppercase tracking-widest opacity-60">
                            <span>{progress}% read</span>
                            <span>{book?.locations?.total || '...'} locations</span>
                        </div>
                    </div>

                    {loadingAudio && <LoadingToast message={ttsIndex.current > 0 ? "Loading next part..." : "Generating Audio..."} onCancel={() => { setLoadingAudio(false); setIsReadingAloud(false); audioPlayerRef.current.pause(); }} />}

                    {showTOC && (
                        <div className="absolute inset-0 top-0 bottom-0 bg-black/60 backdrop-blur-xs z-30" onClick={() => setShowTOC(false)}>
                            <div className={`absolute top-0 right-0 bottom-0 w-72 shadow-2xl overflow-y-auto animate-in slide-in-from-right flex flex-col transition-all duration-300 border-l ${
                                settings.theme === 'dark' ? 'bg-[#151419]/95 border-white/10 text-white' : 
                                (settings.theme === 'sepia' ? 'bg-[#ebdcb9]/95 border-[#5f4b32]/15 text-[#433422]' : 'bg-white/95 border-black/10 text-gray-900')
                            }`} onClick={e => e.stopPropagation()}>
                                <div className="p-4 font-serif text-lg font-bold border-b border-white/5 flex justify-between items-center">
                                    <span>Contents</span>
                                    <div className="flex gap-2">
                                        <button 
                                            onClick={() => isEditingTOC ? saveTOC() : setIsEditingTOC(true)} 
                                            className={`text-[9px] uppercase tracking-wider px-2.5 py-1.5 rounded-full font-bold transition ${
                                                isEditingTOC ? 'bg-brand-red text-white' : 'border border-current hover:bg-black/5'
                                            }`}
                                        >
                                            {isEditingTOC ? "Done" : "Edit"}
                                        </button>
                                        {!isEditingTOC && (
                                            <button 
                                                onClick={scanChapters} 
                                                className="text-[9px] uppercase tracking-wider border border-current hover:bg-black/5 px-2.5 py-1.5 rounded-full font-bold transition" 
                                                disabled={scanning}
                                            >
                                                {scanning ? "Scanning..." : "Detect"}
                                            </button>
                                        )}
                                    </div>
                                </div>
                                <div className="flex-1 overflow-y-auto">
                                    {toc.map((item, i) => (
                                        <div key={i} className="p-3.5 border-b border-white/5 text-sm hover:bg-black/5 flex items-center transition">
                                            {isEditingTOC ? (
                                                <input 
                                                    type="text" 
                                                    value={item.label} 
                                                    onChange={(e) => updateTocItem(i, e.target.value)} 
                                                    className="w-full bg-transparent border-b border-current focus:outline-none py-1 text-sm font-sans" 
                                                />
                                            ) : (
                                                <div 
                                                    onClick={() => { rendition.display(item.href); setShowTOC(false); }} 
                                                    className="cursor-pointer w-full font-serif leading-snug hover:text-brand-red transition"
                                                >
                                                    {item.label}
                                                </div>
                                            )}
                                        </div>
                                    ))}
                                    {toc.length === 0 && !scanning && (
                                        <div className="p-8 text-center text-gray-500 text-sm font-serif italic">No chapters found.<br/>Try Auto-Detect.</div>
                                    )}
                                </div>
                            </div>
                        </div>
                    )}

                    {showAppearance && (
                        <div className="absolute inset-0 z-30" onClick={() => setShowAppearance(false)}>
                             <div className={`absolute top-18 right-4 w-72 rounded-3xl shadow-2xl p-5 animate-in zoom-in-95 overflow-y-auto max-h-[80vh] border transition-all duration-300 ${
                                 settings.theme === 'dark' ? 'bg-[#151419]/95 border-white/10 text-white shadow-black/80' : 
                                 (settings.theme === 'sepia' ? 'bg-[#ebdcb9]/95 border-[#5f4b32]/15 text-[#433422] shadow-[#433422]/20' : 'bg-white/95 border-black/10 text-gray-900 shadow-gray-400/20')
                             }`} onClick={e => e.stopPropagation()}>
                                 
                                 {/* Dynamic Theme selection */}
                                 <div className={`flex justify-between rounded-xl p-1 mb-4 ${settings.theme === 'dark' ? 'bg-white/5' : 'bg-black/5'}`}>
                                     {['light', 'sepia', 'dark'].map(t => (
                                         <button 
                                             key={t} 
                                             onClick={() => updateSetting('theme', t)} 
                                             className={`flex-1 py-1.5 rounded-lg capitalize text-xs font-bold tracking-wider transition-all ${
                                                 settings.theme === t 
                                                     ? 'bg-brand-red text-white shadow-md' 
                                                     : 'text-gray-400 hover:text-gray-600'
                                             }`}
                                         >
                                             {t}
                                         </button>
                                     ))}
                                 </div>
                                 
                                 <div className="mb-4">
                                     <div className="text-[9px] uppercase font-bold tracking-widest opacity-60 mb-2">Font family</div>
                                     <select 
                                         value={settings.fontFamily} 
                                         onChange={(e) => updateSetting('fontFamily', e.target.value)} 
                                         className={`w-full p-2.5 rounded-xl border-none text-xs font-sans focus:ring-1 focus:ring-brand-red ${
                                             settings.theme === 'dark' ? 'bg-white/5 text-white' : 'bg-black/5 text-gray-900'
                                         }`}
                                     >
                                        {fontOptions.map(f => <option key={f.value} value={f.value} className={settings.theme === 'dark' ? 'bg-[#151419] text-white' : 'bg-white text-gray-900'}>{f.label}</option>)}
                                     </select>
                                 </div>
                                 
                                 <div className="mb-4">
                                     <div className="text-[9px] uppercase font-bold tracking-widest opacity-60 mb-2">Line Spacing</div>
                                     <div className={`flex rounded-xl p-1 ${settings.theme === 'dark' ? 'bg-white/5' : 'bg-black/5'}`}>
                                         {[1.2, 1.5, 1.8].map((lh, i) => (
                                             <button 
                                                 key={lh} 
                                                 onClick={() => updateSetting('lineHeight', lh)} 
                                                 className={`flex-1 py-1.5 rounded-lg text-[10px] font-bold uppercase tracking-wider transition ${
                                                     settings.lineHeight === lh ? 'bg-brand-red text-white shadow-sm' : 'text-gray-400 hover:text-gray-600'
                                                 }`}
                                             >
                                                 {i === 0 ? 'Tight' : i === 1 ? 'Normal' : 'Wide'}
                                             </button>
                                         ))}
                                     </div>
                                 </div>
                                 
                                 <div className="flex items-center justify-between gap-4 mb-4">
                                     <button onClick={() => updateSetting('fontSize', Math.max(50, settings.fontSize - 10))} className="p-2 border rounded-xl border-current hover:bg-black/5"><Icon name="minus" size={14} /></button>
                                     <span className="text-xs font-bold font-mono text-center w-12">{settings.fontSize}%</span>
                                     <button onClick={() => updateSetting('fontSize', Math.min(200, settings.fontSize + 10))} className="p-2 border rounded-xl border-current hover:bg-black/5"><Icon name="plus" size={14} /></button>
                                 </div>
                                 
                                 <div className="mb-4">
                                     <div className="text-[9px] uppercase font-bold tracking-widest opacity-60 mb-2">Text Color</div>
                                     <input type="color" value={settings.textColor} onChange={(e) => updateSetting('textColor', e.target.value)} className="w-full h-8 rounded-xl cursor-pointer bg-transparent border border-current p-0.5" />
                                 </div>
                                 
                                 <div className={`border-t pt-4 flex items-center justify-between ${settings.theme === 'dark' ? 'border-white/5' : 'border-black/5'}`}>
                                     <span className="text-[9px] uppercase font-bold tracking-widest opacity-60">Enhance Dialogue</span>
                                     <button 
                                         onClick={() => updateSetting('dialogueEnhance', !settings.dialogueEnhance)} 
                                         className={`w-11 h-6 rounded-full transition-colors relative ${settings.dialogueEnhance ? 'bg-brand-red' : 'bg-gray-300'}`}
                                     >
                                         <div className={`w-4 h-4 bg-white rounded-full absolute top-1 transition-transform duration-200 ${settings.dialogueEnhance ? 'left-[24px]' : 'left-1'}`}></div>
                                     </button>
                                 </div>
                             </div>
                        </div>
                    )}
                    {aiModal === 'summary' && <AIModal type="summary" content={summaryText} onClose={() => setAiModal(null)} />}
                </div>
            );
        };

        const BookEditor = ({ bookId, onClose, onSave, onDelete }) => {
            const [title, setTitle] = useState("Untitled Book");
            const [author, setAuthor] = useState("Unknown Author");
            const [coverId, setCoverId] = useState(null);
            const [coverPreview, setCoverPreview] = useState(null);
            const [epubId, setEpubId] = useState(null);
            const [tracks, setTracks] = useState([]);
            const [processing, setProcessing] = useState(false);
            const [status, setStatus] = useState("");
            const [splitTarget, setSplitTarget] = useState(null);
            const [showDeleteConfirm, setShowDeleteConfirm] = useState(false);

            useEffect(() => {
                if (!bookId) return;
                const load = async () => {
                    const book = await dbOp('readonly', 'books', s => s.get(bookId));
                    if (book) {
                        setTitle(book.title);
                        setAuthor(book.author);
                        setCoverId(book.coverId);
                        setEpubId(book.epubId);
                        const normalizedTracks = (book.tracks || []).map(t => ({
                            ...t,
                            fileId: t.fileId || t.id,
                            start: t.start || 0,
                            duration: t.duration || null 
                        }));
                        setTracks(normalizedTracks);
                        if (book.coverId) {
                            const f = await dbOp('readonly', 'files', s => s.get(book.coverId));
                            if (f) setCoverPreview(URL.createObjectURL(f.data));
                        }
                    }
                };
                load();
            }, [bookId]);

            const handleCoverUpload = async (e) => {
                const file = e.target.files[0];
                if (!file) return;
                setCoverPreview(URL.createObjectURL(file));
                const id = crypto.randomUUID();
                setCoverId(id);
                await saveFiles([{ id, data: file, type: 'image' }]);
            };

            const handleEpubUpload = async (e) => {
                const file = e.target.files[0];
                if (!file) return;
                const id = crypto.randomUUID();
                setEpubId(id);
                await saveFiles([{ id, data: file, type: 'epub' }]);
            };

            const handleAddTracks = async (e) => {
                setProcessing(true);
                setStatus("Importing tracks...");
                const files = Array.from(e.target.files);
                const newFiles = [];
                const newTracks = [];
                for (let f of files) {
                    if (f.name.endsWith('.mp3') || f.name.endsWith('.wav') || f.name.endsWith('.m4a') || f.type.startsWith('audio/')) {
                        const id = crypto.randomUUID();
                        newFiles.push({ id, data: f, type: 'audio' });
                        newTracks.push({ id, fileId: id, name: f.name, start: 0, duration: null });
                    }
                }
                await saveFiles(newFiles);
                setTracks(prev => [...prev, ...newTracks]);
                setProcessing(false);
            };

            const openSplitMenu = async (idx) => {
                const track = tracks[idx];
                const fileRec = await dbOp('readonly', 'files', s => s.get(track.fileId));
                if (!fileRec) return;
                setSplitTarget({ idx, track, file: fileRec.data });
            };

            const executeSplitByTime = async (minutes) => {
                const { idx, track, file } = splitTarget;
                setSplitTarget(null);
                setProcessing(true);
                setStatus("Calculating Duration...");
                try {
                    const audio = document.createElement('audio');
                    audio.muted = true;
                    const url = URL.createObjectURL(file);
                    audio.src = url;
                    await new Promise(r => audio.onloadedmetadata = r);
                    const duration = audio.duration;
                    URL.revokeObjectURL(url);

                    const chunkSeconds = minutes * 60;
                    const parts = Math.ceil(duration / chunkSeconds);
                    const newTracks = [];
                    for (let i = 0; i < parts; i++) {
                        const start = i * chunkSeconds;
                        const end = Math.min((i + 1) * chunkSeconds, duration);
                        newTracks.push({
                            id: crypto.randomUUID(),
                            fileId: track.fileId,
                            name: `${track.name} - Part ${i + 1}`,
                            start: start,
                            duration: end - start
                        });
                    }
                    const updated = [...tracks];
                    updated.splice(idx, 1, ...newTracks);
                    setTracks(updated);
                    setStatus(`Split into ${parts} parts!`);
                } catch(e) { alert("Error splitting file."); } finally { setProcessing(false); setTimeout(() => setStatus(""), 2000); }
            };

            const executeSplitSilence = async () => {
                alert("Please use Time Split for large files.");
                setSplitTarget(null);
            };

            const sortTracks = () => {
                const sorted = [...tracks].sort((a, b) => a.name.localeCompare(b.name, undefined, { numeric: true, sensitivity: 'base' }));
                setTracks(sorted);
            };

            const shuffleTracks = () => {
                setTracks(prev => {
                    const shuffled = [...prev];
                    for (let i = shuffled.length - 1; i > 0; i--) {
                        const j = Math.floor(Math.random() * (i + 1));
                        [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
                    }
                    return shuffled;
                });
            };

            const removeTrack = (idx) => { setTracks(prev => prev.filter((_, i) => i !== idx)); };

            const handleSave = async () => {
                const id = bookId || crypto.randomUUID();
                let currentTrackIndex = 0;
                let currentTime = 0;
                if (bookId) {
                    const old = await dbOp('readonly', 'books', s => s.get(bookId));
                    if (old) { currentTrackIndex = old.currentTrackIndex; currentTime = old.currentTime; }
                }
                const book = { id, title, author, coverId, epubId, tracks, updatedAt: Date.now(), currentTrackIndex, currentTime };
                await dbOp('readwrite', 'books', s => s.put(book));
                onSave();
            };
            
            const handleDeleteBook = async () => {
                if (!bookId) return;
                setProcessing(true);
                setStatus("Deleting...");
                try {
                    await deleteBookDeep(bookId);
                    onDelete();
                } catch (e) {
                    console.error(e);
                    alert("Failed to delete book.");
                    setProcessing(false);
                }
            };

            return (
                <>
                    <div 
                        className="fixed inset-0 z-50 bg-black/70 backdrop-blur-sm animate-in fade-in duration-300"
                        onClick={onClose}
                    />
                    <div className="fixed inset-x-0 bottom-0 top-[8%] md:top-[10%] md:bottom-[8%] max-w-lg md:mx-auto z-50 bg-[#121115]/95 border border-white/10 flex flex-col rounded-t-3xl md:rounded-3xl shadow-2xl animate-in slide-in-from-bottom duration-300 overflow-hidden text-gray-100">
                        <div className="bg-white/5 backdrop-blur border-b border-white/10 px-6 py-4 flex justify-between items-center">
                            <button onClick={onClose} className="text-gray-400 hover:text-white font-sans text-xs uppercase tracking-widest font-bold transition">Cancel</button>
                            <span className="font-serif text-lg font-bold tracking-wide">{bookId ? "Edit Book Portfolio" : "New Book Portfolio"}</span>
                            <button onClick={handleSave} className="text-brand-red hover:text-[#ff4a4d] font-sans text-xs uppercase tracking-widest font-bold transition">Save</button>
                        </div>

                    <div className="flex-1 overflow-y-auto p-6 pb-20 safe-bottom no-scrollbar">
                        <div className="flex gap-4 mb-6">
                            <div className="w-28 h-28 bg-[#18171c] rounded-lg flex-shrink-0 relative overflow-hidden group shadow-md border border-white/5">
                                {coverPreview ? <img src={coverPreview} className="w-full h-full object-cover" /> : <div className="w-full h-full flex items-center justify-center text-gray-500"><Icon name="image" size={28} /></div>}
                                <label className="absolute inset-0 bg-black/60 flex items-center justify-center opacity-0 group-hover:opacity-100 transition cursor-pointer">
                                    <span className="text-white text-[10px] font-bold uppercase tracking-widest bg-brand-red px-2.5 py-1.5 rounded-full">Upload</span>
                                    <input type="file" accept="image/*" className="hidden" onChange={handleCoverUpload} />
                                </label>
                            </div>
                            <div className="flex-1 flex flex-col justify-between py-1">
                                <input 
                                    type="text" 
                                    placeholder="Book Title" 
                                    value={title} 
                                    onChange={e => setTitle(e.target.value)} 
                                    className="w-full bg-white/5 p-2.5 rounded-xl border border-white/10 focus:border-brand-red focus:ring-1 focus:ring-brand-red text-white text-lg font-serif font-semibold outline-none transition" 
                                />
                                <input 
                                    type="text" 
                                    placeholder="Author" 
                                    value={author} 
                                    onChange={e => setAuthor(e.target.value)} 
                                    className="w-full bg-white/5 p-2.5 rounded-xl border border-white/10 focus:border-brand-red focus:ring-1 focus:ring-brand-red text-white text-sm outline-none transition" 
                                />
                            </div>
                        </div>

                        <div className="bg-white/5 border border-white/10 rounded-2xl p-4 mb-6 flex items-center justify-between">
                            <div className="flex items-center gap-3">
                                <div className={`p-3 rounded-xl ${epubId ? 'bg-emerald-500/10 text-emerald-400 border border-emerald-500/20' : 'bg-white/5 text-gray-500 border border-white/5'}`}>
                                    <Icon name="book" size={18} />
                                </div>
                                <div>
                                    <h4 className="font-serif text-sm font-semibold">Manuscript (EPUB)</h4>
                                    <p className="text-xs text-gray-400">{epubId ? "EPUB Loaded successfully" : "No manuscript uploaded"}</p>
                                </div>
                            </div>
                            <label className="text-[10px] font-bold uppercase tracking-wider text-white bg-white/10 hover:bg-white/15 border border-white/10 hover:border-white/20 cursor-pointer px-4 py-2.5 rounded-full transition">
                                {epubId ? "Change" : "Upload"}
                                <input type="file" accept=".epub,application/epub+zip" className="hidden" onChange={handleEpubUpload} />
                            </label>
                        </div>

                        <div className="mb-3 flex items-center justify-between px-1">
                            <h3 className="font-sans text-[10px] font-bold text-gray-400 uppercase tracking-widest">Audio Tracks ({tracks.length})</h3>
                            <div className="flex gap-3">
                                <button onClick={shuffleTracks} className="text-gray-400 hover:text-white text-[10px] font-bold uppercase tracking-wider transition">Shuffle</button>
                                <button onClick={sortTracks} className="text-gray-400 hover:text-white text-[10px] font-bold uppercase tracking-wider transition">Sort</button>
                            </div>
                        </div>

                        <div className="bg-white/5 border border-white/10 rounded-2xl overflow-hidden mb-6">
                            {tracks.length === 0 ? (
                                <div className="p-8 text-center text-gray-500 text-sm font-serif italic">No audio narratives loaded.</div>
                            ) : (
                                <div className="divide-y divide-white/5 max-h-[300px] overflow-y-auto no-scrollbar">
                                    {tracks.map((t, idx) => (
                                        <div key={idx} className="p-3.5 flex items-center gap-3 hover:bg-white/5 transition">
                                            <span className="text-gray-500 text-xs font-mono w-5">{idx + 1}</span>
                                            <div className="flex-1 min-w-0">
                                                <div className="truncate text-sm font-sans font-semibold text-gray-200">{t.name}</div>
                                                <div className="text-[10px] text-gray-400 uppercase tracking-wider font-bold mt-0.5">{t.start > 0 ? `Start: ${formatTime(t.start)}` : 'Full File'}{t.duration && ` • ${formatTime(t.duration)}`}</div>
                                            </div>
                                            {(!t.duration || t.duration > 120) && (
                                                <button 
                                                    onClick={() => openSplitMenu(idx)} 
                                                    className="text-gray-400 hover:text-brand-red hover:bg-white/10 p-2 rounded-full transition"
                                                    title="Split Track"
                                                >
                                                    <Icon name="scissors" size={14} />
                                                </button>
                                            )}
                                            <button 
                                                onClick={() => removeTrack(idx)} 
                                                className="text-gray-500 hover:text-brand-red hover:bg-white/10 p-2 rounded-full transition"
                                                title="Remove Track"
                                            >
                                                <Icon name="minus-circle" size={14} />
                                            </button>
                                        </div>
                                    ))}
                                </div>
                            )}
                            <div className="p-3 bg-white/5 border-t border-white/10">
                                {processing ? (
                                    <div className="flex flex-col items-center justify-center py-2 gap-2">
                                        <div className="animate-spin rounded-full h-5 w-5 border-b-2 border-brand-red"></div>
                                        <div className="text-xs text-gray-400 font-serif italic">{status}</div>
                                    </div>
                                ) : (
                                    <label className="flex items-center justify-center gap-2 text-white hover:text-brand-red font-sans text-xs font-bold uppercase tracking-widest cursor-pointer w-full py-2.5 hover:bg-white/5 rounded-xl transition">
                                        <Icon name="plus-circle" size={16} /> Add Audio Files
                                        <input type="file" multiple accept=".mp3,.wav,.m4a,audio/*" className="hidden" onChange={handleAddTracks} />
                                    </label>
                                )}
                            </div>
                        </div>

                        {bookId && (
                            <div className="mt-8 mb-4">
                                {!showDeleteConfirm ? (
                                    <button 
                                        onClick={() => setShowDeleteConfirm(true)} 
                                        className="w-full py-3.5 rounded-xl bg-brand-red/10 border border-brand-red/20 text-brand-red hover:bg-brand-red/20 hover:border-brand-red/30 font-sans text-xs font-bold uppercase tracking-widest transition-colors duration-200"
                                    >
                                        Delete Book Portfolio
                                    </button>
                                ) : (
                                    <div className="bg-brand-red/10 border border-brand-red/20 rounded-2xl p-4 animate-in fade-in slide-in-from-bottom-2">
                                        <p className="text-center text-brand-red font-serif italic mb-3 text-sm">Are you sure? This action cannot be undone.</p>
                                        <div className="flex gap-3">
                                            <button 
                                                onClick={() => setShowDeleteConfirm(false)} 
                                                className="flex-1 py-2.5 rounded-xl bg-white/5 border border-white/10 text-gray-300 font-sans text-xs font-bold uppercase tracking-widest hover:bg-white/10 transition"
                                            >
                                                Cancel
                                            </button>
                                            <button 
                                                onClick={handleDeleteBook} 
                                                className="flex-1 py-2.5 rounded-xl bg-brand-red hover:bg-[#be2f31] text-white font-sans text-xs font-bold uppercase tracking-widest shadow-lg transition"
                                            >
                                                Confirm Delete
                                            </button>
                                        </div>
                                    </div>
                                )}
                            </div>
                        )}
                    </div>
                    {splitTarget && <SplitOptions file={splitTarget.file} onSplitByTime={executeSplitByTime} onSplitSilence={executeSplitSilence} onCancel={() => setSplitTarget(null)} />}
                </div>
                </>
            );
        };

        const Player = ({ bookId, onBack }) => {
            const audioRef = useRef(null);
            const [book, setBook] = useState(null);
            const [cover, setCover] = useState(null);
            const [playing, setPlaying] = useState(false);
            const [time, setTime] = useState(0);
            const [dur, setDur] = useState(0); 
            const [showList, setShowList] = useState(false);
            const [showReader, setShowReader] = useState(false);
            const activeFileId = useRef(null);

            useEffect(() => {
                const load = async () => {
                    const b = await dbOp('readonly', 'books', s => s.get(bookId));
                    setBook(b);
                    if (b.coverId) {
                        const f = await dbOp('readonly', 'files', s => s.get(b.coverId));
                        if(f) setCover(URL.createObjectURL(f.data));
                    }
                    if (b.tracks.length > 0) await loadTrack(b, b.currentTrackIndex || 0, false);
                };
                load();
            }, [bookId]);

            const loadTrack = async (b, index, autoPlay) => {
                const track = b.tracks[index];
                if (!track) return;
                const fileId = track.fileId || track.id;
                const startTime = track.start || 0;
                
                if (activeFileId.current !== fileId) {
                    const f = await dbOp('readonly', 'files', s => s.get(fileId));
                    if (f) {
                        const url = URL.createObjectURL(f.data);
                        audioRef.current.src = url;
                        activeFileId.current = fileId;
                        audioRef.current.currentTime = (index === b.currentTrackIndex) ? (b.currentTime || startTime) : startTime;
                    }
                } else {
                    const buffer = 1; 
                    if (audioRef.current.currentTime < startTime - buffer || audioRef.current.currentTime > (track.start + (track.duration||99999))) {
                        audioRef.current.currentTime = startTime;
                    }
                }
                if (autoPlay) { try { await audioRef.current.play(); setPlaying(true); } catch(e){} }
            };

            const updateBookProgress = (t) => {
                if (!bookId) return;
                patchBook(bookId, { currentTime: t });
            };

            const changeTrack = async (idx) => {
                const b = { ...book, currentTrackIndex: idx };
                const t = b.tracks[idx];
                b.currentTime = t.start || 0; 
                setBook(b);
                await loadTrack(b, idx, true);
                patchBook(bookId, { currentTrackIndex: idx, currentTime: b.currentTime });
            };

            const handleTimeUpdate = () => {
                const ct = audioRef.current.currentTime;
                setTime(ct);
                setDur(audioRef.current.duration);
                updateBookProgress(ct);

                if (book && book.tracks[book.currentTrackIndex]) {
                    const current = book.tracks[book.currentTrackIndex];
                    const endTime = (current.start || 0) + (current.duration || 999999);
                    
                    if (current.duration && ct >= endTime - 0.2) {
                        if (book.currentTrackIndex < book.tracks.length - 1) {
                            const nextIndex = book.currentTrackIndex + 1;
                            const nextTrack = book.tracks[nextIndex];
                            setBook(prev => ({ ...prev, currentTrackIndex: nextIndex }));
                            
                            if ((nextTrack.fileId || nextTrack.id) === (current.fileId || current.id)) {
                                patchBook(bookId, { currentTrackIndex: nextIndex });
                            } else {
                                changeTrack(nextIndex);
                            }
                        } else {
                            setPlaying(false);
                        }
                    }
                }
            };

            if (!book) return null;

            const currentTrack = book.tracks[book.currentTrackIndex];
            const trackStart = currentTrack?.start || 0;
            const trackDur = currentTrack?.duration || dur;
            const sliderVal = time - trackStart;
            
            return (
                <div className="relative h-full flex flex-col bg-[#09080a] overflow-hidden text-gray-100">
                    
                    {/* Blurry Atmospheric Cover Art Backdrop */}
                    <div className="absolute inset-0 pointer-events-none transition-opacity duration-1000 overflow-hidden z-0">
                        {cover ? (
                            <img src={cover} className="w-full h-full object-cover filter blur-[100px] opacity-25 scale-110" />
                        ) : (
                            <div className="w-full h-full bg-gradient-to-tr from-[#1b1220] via-[#0d0d12] to-[#121c25]"></div>
                        )}
                    </div>

                    {/* Glass Header */}
                    <div className="safe-top px-6 pt-4 pb-2 flex justify-between items-center z-10 bg-black/10 backdrop-blur-xs border-b border-white/5">
                        <button onClick={onBack} className="p-2.5 text-gray-400 hover:text-white bg-white/5 hover:bg-white/10 border border-white/10 rounded-full transition active:scale-90 shadow-lg">
                            <Icon name="chevron-down" size={16} />
                        </button>
                        <span className="text-[10px] font-bold text-gray-400 uppercase tracking-[0.25em] font-sans">Now Narrating</span>
                        <button onClick={() => setShowList(true)} className="p-2.5 text-gray-400 hover:text-white bg-white/5 hover:bg-white/10 border border-white/10 rounded-full transition active:scale-90 shadow-lg">
                            <Icon name="list" size={16} />
                        </button>
                    </div>

                    {/* Center Column Container */}
                    <div className="flex-1 flex flex-col items-center justify-center p-6 md:p-8 space-y-6 md:space-y-8 z-10">
                        
                        {/* Immersive Book Cover Art Card */}
                        <div className={`aspect-[3/4] max-w-[240px] md:max-w-[270px] w-full rounded-2xl overflow-hidden relative shadow-[0_24px_50px_rgba(0,0,0,0.7)] border border-white/10 transition-all duration-500 ease-out book-sheen ${
                            playing ? 'scale-[1.03] shadow-[0_30px_60px_rgba(0,0,0,0.8)]' : 'scale-95'
                        }`}>
                            {/* Left spine shadow overlay */}
                            <div className="absolute left-0 top-0 bottom-0 w-3 bg-black/35 z-20 border-r border-white/5 shadow-[2px_0_5px_rgba(0,0,0,0.4)]"></div>
                            {cover ? (
                                <img src={cover} className="w-full h-full object-cover relative z-10" />
                            ) : (
                                <div className="w-full h-full flex flex-col items-center justify-center bg-[#1c1b22] text-gray-500 relative z-10 p-4">
                                    <Icon name="book" size={48} className="opacity-30 mb-2" />
                                    <span className="font-serif text-sm text-center opacity-50 px-2 line-clamp-3">{book.title}</span>
                                </div>
                            )}
                        </div>

                        {/* Literary Meta Data */}
                        <div className="text-center w-full max-w-sm px-4">
                            <h2 className="font-serif text-2xl md:text-3xl font-bold truncate text-white leading-tight">{book.title}</h2>
                            <p className="font-sans text-[11px] font-bold text-gray-400 uppercase tracking-[0.2em] mt-1.5">{book.author}</p>
                            <div className="border border-white/10 bg-white/5 text-gray-300 text-xs font-semibold px-4 py-2 rounded-full inline-block mt-4 truncate max-w-full font-sans tracking-wide">
                                {currentTrack?.name || "No audio narrative loaded"}
                            </div>
                        </div>

                        {/* Range Slider Container */}
                        <div className="w-full max-w-sm px-6">
                            <input 
                                type="range" 
                                min="0" max={trackDur || 1} 
                                value={Math.max(0, sliderVal)} 
                                onChange={(e) => { 
                                    const seekTime = Number(e.target.value) + trackStart;
                                    audioRef.current.currentTime = seekTime; 
                                    setTime(seekTime); 
                                }}
                                className="w-full"
                            />
                            <div className="flex justify-between text-[10px] font-bold uppercase tracking-widest text-gray-400 mt-2.5 font-mono">
                                <span>{formatTime(sliderVal)}</span>
                                <span>-{formatTime(trackDur - sliderVal)}</span>
                            </div>
                        </div>

                        {/* Player controls */}
                        <div className="flex items-center justify-between w-full max-w-xs px-8">
                            <button onClick={() => audioRef.current.currentTime -= 30} className="text-gray-400 hover:text-white transition flex flex-col items-center gap-1.5 active:scale-95">
                                <Icon name="rotate-ccw" size={24} /> 
                                <span className="text-[9px] font-bold uppercase tracking-wider opacity-60">30s</span>
                            </button>
                            <button 
                                onClick={() => { if(playing) audioRef.current.pause(); else audioRef.current.play(); setPlaying(!playing); }} 
                                className="w-18 h-18 bg-brand-red hover:bg-[#be2f31] text-white rounded-full flex items-center justify-center shadow-[0_0_25px_rgba(219,56,58,0.4)] hover:shadow-[0_0_35px_rgba(219,56,58,0.6)] hover:scale-105 active:scale-95 transition-all duration-300 ease-out"
                            >
                                <Icon name={playing ? "pause" : "play"} size={26} className={playing ? "" : "ml-1"} />
                            </button>
                            <button onClick={() => audioRef.current.currentTime += 300} className="text-gray-400 hover:text-white transition flex flex-col items-center gap-1.5 active:scale-95">
                                <Icon name="rotate-cw" size={24} /> 
                                <span className="text-[9px] font-bold uppercase tracking-wider opacity-60">5m</span>
                            </button>
                        </div>
                    </div>

                    {/* Immersive Read Along Button Panel */}
                    {book.epubId && (
                        <div className="safe-bottom pb-8 flex justify-center z-10">
                             <button onClick={() => setShowReader(true)} className="flex items-center gap-2.5 bg-white/10 hover:bg-white/15 border border-white/15 hover:border-white/20 px-6 py-3 rounded-full shadow-lg text-[10px] font-bold uppercase tracking-[0.2em] text-white hover:scale-[1.02] active:scale-95 transition-all duration-300 backdrop-blur">
                                <Icon name="book-open" size={14} /> Read Along
                            </button>
                        </div>
                    )}

                    {/* Chapters Drawer Modal */}
                    {showList && (
                        <div className="absolute inset-0 z-20 bg-black/60 backdrop-blur-xs flex flex-col justify-end" onClick={() => setShowList(false)}>
                            <div className="bg-[#121115]/95 border-t border-white/10 backdrop-blur-lg rounded-t-3xl max-h-[70vh] flex flex-col p-6 shadow-2xl w-full max-w-lg md:mx-auto animate-in slide-in-from-bottom duration-300" onClick={e => e.stopPropagation()}>
                                <h3 className="font-serif text-xl font-bold border-b border-white/5 pb-3 text-white mb-4">Audio Narrations</h3>
                                <div className="overflow-y-auto flex-1 no-scrollbar">
                                    {book.tracks.map((t, i) => (
                                        <div 
                                            key={i} 
                                            onClick={() => { changeTrack(i); setShowList(false); }} 
                                            className={`p-3.5 rounded-xl mb-1.5 flex items-center gap-3 transition cursor-pointer ${
                                                i === book.currentTrackIndex 
                                                    ? 'bg-brand-red text-white font-semibold shadow-md' 
                                                    : 'text-gray-400 hover:bg-white/5 hover:text-white'
                                            }`}
                                        >
                                            <span className="font-mono text-xs w-6 opacity-60">{i + 1}</span>
                                            <span className="truncate text-sm font-sans font-semibold tracking-wide">{t.name}</span>
